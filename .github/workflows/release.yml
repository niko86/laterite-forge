# Release: build the `laterite-ags4-forge` binary per platform, archive it,
# checksum the archives and attach them to a GitHub release. Modelled on the
# `build-binaries` + `github-release` jobs of laterite's release.yml (the `lat`
# binary), on GitHub-hosted runners, where bash is available on Windows too.
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the channel; each target is its runner's host,
      # so the pinned toolchain already has it.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # explicit channel — required when hash-pinned

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive
        env:
          NAME: laterite-ags4-forge-${{ github.ref_name }}-${{ matrix.target }}
        run: |
          mkdir out
          cp "target/${{ matrix.target }}/release/laterite-ags4-forge${{ matrix.ext }}" out/
          cp LICENSE README.md out/
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd out && 7z a -tzip "../$NAME.zip" .)
          else
            tar -czf "$NAME.tar.gz" -C out .
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            laterite-ags4-forge-*.tar.gz
            laterite-ags4-forge-*.zip

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artefacts/
          merge-multiple: true

      - name: Checksums
        working-directory: artefacts
        run: sha256sum laterite-ags4-forge-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artefacts/laterite-ags4-forge-*
            artefacts/SHA256SUMS
