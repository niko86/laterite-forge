sequence = { weights = [113, 118, 65], basis = "BGS NGDC AGS accessions of the NE England crawl that hold BKFL, listed under site_share: 405 holes with backfill and no installation (no PIPE or MONG), of which arisings alone 113, bentonite alone 118 and arisings over bentonite 65 (the rest, grout, concrete and longer sequences, left out), forge analysis. Contains data supplied by UKRI, OGL v3." }
