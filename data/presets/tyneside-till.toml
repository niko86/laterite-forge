[construction.installation]
site_share = { min = 0.53, max = 0.53, basis = "BGS NGDC AGS accessions of the NE England crawl that hold PIPE (121869, 128125, 163565, 165950, 165951, 167411, 169655, 169656, 169657, 173968, 173969, 173971, 174053, 174059, 174066, 186779, 186814): installation is a project-level practice. Of 19 projects with five or more CP-type holes, 10 have PIPE in 43% to 100% of those holes and 9 in none, so 10 of 19 sites install (0.53; files de-duplicated by content, forge analysis). Forge calibration to the crawl: over 6,000 seeds 3,115 sites (0.52) install at least one hole. Contains data supplied by UKRI, OGL v3." }
hole_share = { min = 0.43, max = 1.0, basis = "BGS NGDC AGS accessions of the NE England crawl that hold PIPE, listed under site_share: on the 10 projects that install, the share of their CP-type holes with PIPE is 0.43, 0.44, 0.49, 0.64, 0.64, 0.67, 0.77, 0.83, 0.83 and 1.00 (P50 0.65), forge analysis. The site's share is drawn uniformly over that range (forge judgement: ten projects do not support a better shape), which gives a mean of 0.72; forge calibration to the crawl: over 6,000 seeds an installing site installs 0.72 of its holes and the file installs 0.37 of all its holes (crawl: PIPE in 334 of 1,041 holes with GEOL, 0.32, of every hole type). Contains data supplied by UKRI, OGL v3." }
kinds = [
    { kind = "standpipe", mm = 50, weight = 162 },
    { kind = "piezometer", mm = 19, weight = 88 },
]
kinds_basis = "BGS NGDC AGS accessions of the NE England crawl that hold PIPE, listed under site_share: of 334 holes with PIPE, 162 have a 50 mm installation (a standpipe) and 88 a 19 mm one or a piezometer tip row (a standpipe piezometer); 82 record no diameter and 2 have another, and are left out (forge analysis). A standpipe is plain from the surface to the top of the response zone and slotted through it. A piezometer is plain, then a 0.3 m tip written as SLOTTED, because the dictionary's PIPE_TYPE has only PLAIN and SLOTTED (the crawl's tip rows are 0.3 m at P10, P50 and P90, n = 43). Craig's Soil Mechanics, 7th ed., 2004, pp.405-406: an open standpipe is normally plastic tube of 50 mm or smaller with the lower end perforated or fitted with a porous element, sand or fine gravel packed around that end, a bentonite seal immediately above, the rest of the hole backfilled and a second seal near the surface (forge judgement for the construction). Forge calibration to the crawl: over 6,000 seeds 63.6% of installations are standpipes (crawl 162 of 250, 64.8%). Contains data supplied by UKRI, OGL v3."
zone_offset_m = { min = -3.2, max = 4.2, skew = 1.0, basis = "BGS NGDC AGS accessions of the NE England crawl that hold both PIPE and WSTG (121869, 128125, 163565, 165951, 169655, 169656, 173968, 173969, 173971, 174053, 174059, 186779, 186814): top of the slotted section less the depth of the hole's first strike, P10 -2.7 m, P50 0.0 m, P90 +3.0 m (n = 137 holes), forge analysis. A hole whose strike is not in the file draws its zone top from zone_top_m. The range is fitted to these and moved up a little, because clamping the zone into the hole (below the pit base and the cap, seal and filter above, above the filter and bentonite tail) pulls tops upward; forge calibration to the crawl: file P10 -2.8 m, P50 -0.1 m, P90 +3.1 m (6,000 seeds, 776 holes with a strike). Contains data supplied by UKRI, OGL v3." }
zone_top_m = { min = 0.9, max = 16.0, skew = 2.7, basis = "BGS NGDC AGS accessions of the NE England crawl that hold PIPE, listed under site_share: top of the slotted section in the 89 holes with a slotted section and no recorded strike, P10 1.0 m, P50 3.0 m, P90 11.6 m, forge analysis. Range and skew fitted to these; forge calibration to the crawl: file P10 1.20 m (a zone cannot start above the 1.2 m inspection pit base), P50 3.11 m, P90 11.15 m (6,000 seeds, 10,395 holes). No targeting of strata (forge judgement): of 225 NE zones about 120 lie over fine or till-led ground, 56 over granular ground, 34 in rock and 15 in made ground (a keyword classification of GEOL_DESC, forge analysis), so the zone is placed by depth alone. Contains data supplied by UKRI, OGL v3." }
slotted_length_m = { min = 0.4, max = 7.2, skew = 1.9, basis = "BGS NGDC AGS accessions of the NE England crawl that hold PIPE, listed under site_share: length of the SLOTTED rows, P10 0.5 m, P50 2.25 m, P90 6.0 m (n = 180 rows), forge analysis. Range and skew fitted to these; forge calibration to the crawl: file P10 0.49 m, P50 2.23 m, P90 6.00 m (6,000 seeds, 7,110 standpipes). A piezometer's tip is 0.3 m and does not draw from this. Contains data supplied by UKRI, OGL v3." }
base_gap_m = { min = 0.5, max = 12.0, skew = 1.9, basis = "BGS NGDC AGS accessions of the NE England crawl that hold PIPE, listed under site_share: final depth less the deepest PIPE_BASE, P10 0.5 m, P50 3.5 m, P90 20.5 m (n = 310 holes with a base), forge analysis. In the file this is a ceiling: the zone sits between the pit base and the final depth less this gap (raised to the 0.6 m the filter and bentonite tail need). The range and skew are fitted to the crawl's P10 and median and cut off at 12 m, so the file's drawn gap is P10 0.5 m, P50 3.5 m, P90 9.9 m (forge judgement: a longer ceiling gap would pull zones in this site's 15-30 m holes above the strikes they follow). The ceiling rarely binds, because the zone is placed from its top: the file's final depth less zone base is P10 7.4 m, P50 15.5 m, P90 23.8 m, in holes deeper than the crawl's (forge calibration). Contains data supplied by UKRI, OGL v3." }
cap_m = { min = 0.5, max = 0.5, basis = "BGS NGDC AGS accessions of the NE England crawl that hold both PIPE and BKFL (121869, 128125, 165950, 165951, 167411, 169655, 169656, 169657, 173968, 173969, 173971, 174053, 174059, 174066, 186779, 186814): the concrete (906) layer from the surface in holes with PIPE, P10 0.2 m, P50 0.5 m, P90 0.5 m (n = 266 holes), forge analysis. Forge judgement: 0.5 m in every installed hole, the median and the upper end. Contains data supplied by UKRI, OGL v3." }
filter = { weights = [165, 58], basis = "BGS NGDC AGS accessions of the NE England crawl that hold both PIPE and BKFL, listed under cap_m: of 223 holes whose slotted section lies inside a gravel (902) or sand (901) layer, 165 have gravel and 58 sand, forge analysis. The filter runs 0.5 m above the slotted section to 0.5 m below it (filter top less slotted top -0.5 m at P10 and P50 and 0.0 at P90, filter base less slotted base 0.0, +0.5 and +0.5 m at P10, P50 and P90, n = 178 holes), with bentonite (903) in the seal above and below to the final depth: concrete over bentonite over gravel over bentonite in 94 of 335 holes with PIPE or MONG, and with sand in place of gravel in 60 (forge analysis). Craig's Soil Mechanics, 7th ed., 2004, pp.405-406 describes the same construction. Forge calibration to the crawl: gravel in 74.1% of installed holes in the file. Contains data supplied by UKRI, OGL v3." }
