strike_gap_m = { min = 0.0, max = 2.0, skew = 2.8, basis = "BGS NGDC AGS accessions of the NE England crawl that hold WSTG_CAS (42158, 121869, 126770, 128125, 163565, 163846, 165951, 169655, 169656, 169722, 173968, 173969, 173971, 174053, 174059, 186779): strike depth less the casing depth at the strike, P10 0.0 m, P25 0.2 m, P50 0.5 m, P75 1.6 m, P90 4.8 m (n = 227 strikes in 170 holes). The range and skew are calibrated so the file's gaps over many seeds (1,500 seeds, 871 strikes) match the crawl's median and upper quartile (file P50 0.49 m, P75 1.3 m, P90 2.6 m); the upper tail comes from the 18% of holes whose final casing stops above the strike, where the casing at the strike is the final casing, and stays under the crawl's P90 (forge calibration; docs/research/tyneside-till-sources.md), forge analysis. Contains data supplied by UKRI, OGL v3." }

