55-7, 165950, 42158, 126770, 174053, 173968-71, 163688, 186779, 191205, 163846, 163546, 163565 and others (793 holes, 38 projects, NE England): refusals (N of 50 or more, a * in ISPT_REP, or a main drive under 300 mm) in red and brown till by depth below ground, refusals/tests: 0-3 m 5/78, 3-6 m 22/155, 6-10 m 33/176, 10-15 m 50/150, below 15 m 70/150 (709 tests, 26 projects, 25%), forge analysis. The share is the obstruction (cobble and boulder) refusals only, share = top + per_m x z clamped to 0 to 1, with strength refusals (any drawn N of 50 or more) on top; top and per_m are fitted together to the unit's total (25%) and its depth profile in the model's own test depths, the file giving 25.2%. This is per_m (share per metre of depth), fitted mean 0.0208, the range about +-30% about it for site-to-site variation (forge judgement). The refusal convention (N 50 not extrapolated, MAIN 50, NPEN 150 + p, REP 50/p) is forge judgement (owner decision, niko86/laterite-forge#63). Contains data supplied by UKRI, OGL v3." } } }

