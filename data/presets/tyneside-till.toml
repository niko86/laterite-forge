# tyneside-till: weathered till over red till over grey till, with a
# glaciofluvial sand and gravel lens, in the Late Devensian lowland till of
# NE England (Tyneside, Northumberland, Durham) (ADR 0001, #13). Every range
# carries its basis. A basis names the source as found (paper, volume, printed
# page, table or figure). "forge judgement" marks a value that describes the
# synthetic site or a modelling choice, not the ground. "forge calibration to
# <source>" marks a range tuned so that the values the file writes, pooled
# over many seeds, match the named source's mean and spread or percentiles
# (docs/research/tyneside-till-sources.md has the method and results).
#
# Versioning: from v1, any change to what this preset generates bumps
# `version`, and consumers are told and re-baseline (ADR 0001).
#
# Units. The till is tripartite (Clarke, Hughes & Hashemi 2008, Fig. 3, p.68;
# Hughes, Clarke & Money 1998, Fig. 7, p.224, both after Robertson et al.
# 1994): a weathered, mottled upper till (WT), a dark reddish brown till (RT)
# and a dark grey lower till (GT), which runs to final depth here (the site
# model has no bedrock). Eyles & Sladen 1981 (pp.134-135) read the red till as
# the weathered top of one grey lodgement till; the preset keeps the three
# units the engineering papers tabulate. The till holds intraformational
# sands and gravels (Eyles & Sladen 1981, summary, p.129), as ribbons under
# 200 m across and "frequently water-bearing" (p.134), mostly under 1 m thick
# (Hughes et al. 1998, p.223): the GFSG lens, placed in the grey till.
#
# Description constraints (not ranges, so they carry no basis field) follow
# these sources:
# - Red till: "stiff dark reddish brown sandy silty CLAY with some fine to
#   coarse gravel, occasional cobbles and boulders"; grey till: "stiff and
#   very stiff dark grey sandy silty CLAY with some to much fine to coarse
#   gravel, some cobbles and occasional boulders" (Hughes et al. 1998, Fig. 7,
#   p.224). Colours 5YR 3/3 and 2.5Y 4/1 (Eyles & Sladen 1981, p.134).
# - Weathered till: mottled orange, brown and grey upper till (Clarke et al.
#   2008, Fig. 3, p.68; Hughes et al. 1998, Fig. 7, p.224).
# - Cobbles and boulders: "low" content in the red and grey tills, the modern
#   wording (Norbury, Soil and Rock Description in Engineering Practice, 2010,
#   Table 8.4, p.112: cobbles low < 10%, boulders low < 5%) for the papers'
#   "occasional" and "some"; that mapping is forge judgement.
# - Lens: "dense silty SAND and GRAVEL with thickly laminated CLAY" (Hughes et
#   al. 1998, Fig. 7, p.224); "light brown or grey, silty SAND, SAND and
#   GRAVEL" (Culshaw et al. 2017, Appendix 6.1, Wear Till Formation).
#
# Sources (each range names the ones it uses):
# - Clarke, Hughes & Hashemi (2008), Physical characteristics of subglacial
#   tills, Geotechnique 58(1):67-76, doi:10.1680/geot.2008.58.1.67. Table 1,
#   p.71: unit means and SDs of cu, w, PL, LL and bulk density from 15
#   Northumberland investigations (over 5,500 samples).
# - Hughes, Clarke & Money (1998), The glacial succession in lowland Northern
#   England, QJEG 31:211-234.
# - Eyles & Sladen (1981), Stratigraphy and geotechnical properties of
#   weathered lodgement till in Northumberland, England, QJEG 14:129-141.
# - Trenter (1999), Engineering in glacial tills, CIRIA C504.
# - Hashemi (2002), PhD thesis, University of Newcastle (design of a relational
#   database on geotechnical properties of Northern England glacial till),
#   Tables 5.1 to 5.3, pp.91-92: effective strength c' and phi' by till unit and
#   area (v5).
# - ICE Manual of Geotechnical Engineering Vol. 1 and Vol. 2, 2012.
# - Culshaw et al. (2017), Material properties and geohazards, Geol. Soc.
#   London Eng. Geol. Spec. Publ. 28, ch. 6, doi:10.1144/EGSP28.6.
# - Norbury (2010), Soil and Rock Description in Engineering Practice.
# - Bond and Harris (2008), Decoding Eurocode 7, ch. 4, s4.5.4, Figs 4.14 and
#   4.15, p.108, and Example 4.3, p.124 (minimum tests per stratum).
# - BGS National Geotechnical Data Centre AGS accessions, forge analysis of a
#   crawl of NE England (793 holes, 38 projects; Tyne and Wear 399 holes,
#   Co. Durham 207, Teesside 105, Northumberland 81): 42158, 121869, 125313,
#   126770, 128125, 138587, 163546, 163565, 163688, 163846, 164065, 165950,
#   165951, 167411, 169655, 169656, 169657, 169722, 173968, 173969, 173970,
#   173971, 174053, 174059, 174066, 186779, 186814, 188500, 188659, 191205,
#   192051. Lab data from 174059, 163846, 169655, 186814, 174053, 186779,
#   165950; effective-stress triaxial (TREG, TRET) data from 165950, 169655,
#   174053 and 174059. Units were classed from descriptions and colour words
#   (docs/research/tyneside-till-sources.md). Open Government Licence v3.
#   Contains data supplied by UKRI.
#
# Water: a hole whose lens yields water (the lens's share below) strikes at
# the lens top; a dry lens can still give a strike where the water table falls
# inside it (src/site/water.rs). From v8 each till also strikes water along
# its depth (the strike table on WT, RT and GT, below).
#
# v2 (#63): SPT refusals. The ISPT suite lists ISPT_MAIN, ISPT_NPEN and
# ISPT_REP, and any N of 50 or more is written as a refusal, so every N above
# 50 that v1 wrote becomes 50 (p = 300 x 50 / N mm, at least 1 and under 300).
# The refusal convention is forge judgement (owner decision, niko86/laterite-forge#63):
# an ordinary test writes ISPT_MAIN = N, ISPT_NPEN = 450 and ISPT_REP = "N=<N>";
# a refusal writes ISPT_NVAL = 50 (not extrapolated), ISPT_MAIN = 50, ISPT_NPEN =
# 150 + p and ISPT_REP = "50/<p>", p the main-drive penetration reached, mm.
# Each till and the lens take a refusal_share for the cobble and boulder
# strikes. WT's is a plain share. RT, GT and GFSG take the linear form
# (share = top + per_m x depth, clamped to 0 to 1, top and per_m drawn once
# per site), fitted so that strength plus obstruction refusals total the
# crawl's rates (WT 12%, red and brown 25%, grey 33%, GFSG 28%; the file gives
# 12.0%, 25.2%, 33.1%, 28.1%) and follow the crawl's rise with depth as far as
# the model's own test depths allow (docs/research/tyneside-till-sources.md
# has the per-unit and per-depth tables). The weathered till now carries the
# red till's very_coarse cobbles and boulders (low), which a share needs; it
# is the weathered top of the red till (Eyles & Sladen 1981, pp.134-135;
# Clarke et al. 2008, Table 1 taken as upper red till), forge judgement. The
# GFSG spt_n range rose from 5-46 to 6-53 so its non-refusal mean stays at the
# crawl's 24.9 (the file gives 25.0). Pooled over the tills the file's
# refusals are 17%, 20%, 21%, 28% and 50% at 0-3, 3-6, 6-10, 10-15 and over
# 15 m against the crawl's 8%, 15%, 19%, 32% and 55%: the shallow bands cannot
# fall below the grey till's strength refusals (18%, with no depth trend in cu).
#
# v3 (#58): cover layer. A [cover] block gives each hole topsoil with
# probability 47% (370 of 787 holes logged from the surface in the NE crawl
# listed above) and no surfacing. The topsoil takes its thickness off the top
# of the hole's first stratum, so every other boundary, sample, test and strike
# is where v2 put it; only the first GEOL row's top moves and one row is added.
# It is worded "<colour> <minor fractions> TOPSOIL with rootlets.", a format
# that is forge judgement following Norbury 2010's Made Ground convention
# (ch. 14, pp.208-214). Nothing is sampled or tested in the topsoil, and a
# sample that would start in it moves to its base or is dropped
# (src/site/cover.rs).
# v4 (#2): multi-stage UU triaxial. Each till takes a triaxial table, a share
# of its TRIG tests that are multi-stage (TRIG_TYPE UUM, three TRIT rows,
# TRIT_TESN 1 to 3, cell pressure x1/x2/x4 the single-stage value, cu of stage k
# = stage 1's x (1 + stage_gain x (k - 1)), TRIT_DEVF twice that cu, and the
# specimen's TRIT_BDEN and TRIT_IMC repeated on every stage). The share is
# 0.49-0.59 (the crawl's 32 of 59, forge judgement for the width), and
# stage_gain 0.10-0.30 is fitted to the crawl's 32 UUM sets (mean 0.20). Each
# test makes its own keyed draw on whether it is UUM, so a share moves only its
# own unit's TRIG and TRIT rows. Every TRIG and TRIT row of a single-stage test
# is what v3 wrote; the draws that choose which tests are multi-stage change the
# TRIG_TYPE of those tests and add their TRIT rows.
#
# v5 (#68): effective-stress triaxial. Each till takes an effective_strength
# table (c', phi' and Skempton's A_f, each a cited range drawn once per site),
# and the suite gains TREG and TRET entries. A TREG set is drawn per tested
# sample at a rate 0.97 of TRIG's (the crawl's 57 sets to 59 TRIG tests), of
# type CUM, CDM, CU or CD in the crawl's 22:15:10:10, with three TRET rows
# (TRET_TESN 1 to 3). Stage 1's effective confining stress is 10 kPa per metre
# of specimen depth and stages 2 and 3 are 2 and 4 times it; the back pressure
# is 300 kPa (TRET_PWPI), TRET_CELL is that plus the effective stress and
# TRET_CONP is the effective stress. A drained stage (CD, CDM) fails on the
# Mohr-Coulomb envelope of the set's c' and phi' with no pore pressure change
# (3% scatter on TRET_DEVF); an undrained one (CU, CUM) draws A_f per stage and
# fails on the envelope in effective stress with TRET_PWPF = TRET_PWPI + A_f x
# TRET_DEVF (the algebra is in src/site/effective.rs). CUM and CDM are one
# specimen, so TRET_BDEN and TRET_IMC repeat; CU and CD are three specimens,
# keyed as the crawl's files key them (one TREG row, one SPEC_REF and
# SPEC_DPTH, TRET_TESN 1 to 3), each with its own density and moisture
# content. TREG_COH and TREG_PHI are the least-squares line through the set's
# three failure points, and TREG_FCR is "Maximum effective principal stress
# ratio" for CUM and "Maximum Deviator Stress" for the rest. Every
# other group is what v4 wrote; the TREG and TRET groups are written after
# WSTD. The set scatter on c' (SD 2.0 kPa), on phi' (SD 1.5 deg) and on A_f
# per stage (SD 0.10), the 10 kPa/m, the x1/x2/x4 stages and the 300 kPa back
# pressure are forge judgement (owner decisions, niko86/laterite-forge#68; the
# crawl's median stage-1 stress is 10.0 kPa/m and its stage ratios 2.0).
#
# v6 (#74): hole construction. A [construction] block gives every hole HDPH
# (an inspection pit from 0 to 1.2 m, then CP to final depth, so LOCA_TYPE is
# IP+CP), CDIA (one casing string, or two when telescoped, never a larger
# diameter below a smaller one), a WSTG_CAS on every strike, and, at the sites
# that carry it, BKFL (arisings, bentonite, or arisings over bentonite, from 0
# to final depth, legend codes 905 and 903 only). A site draws once whether its
# holes carry BKFL (0.7: 11 of the crawl's 15 projects). The final casing
# passes the strike in 82% of holes (the NE crawl's rate), and WSTG_CAS never
# exceeds the strike or the final casing. Every other group is what v5 wrote
# (a_preset_without_its_construction_writes_the_previous_versions_bytes); the
# construction groups are written after the suite. The inspection pit is 0 to
# 1.2 m in 188 of 188 rows of the NE crawl and the owner's practice note
# (forge judgement); the rest is forge analysis of the NE crawl's CDIA,
# WSTG_CAS and BKFL (src/site/construction.rs,
# docs/research/tyneside-till-sources.md).
# v7 (#75): installations. A [construction.installation] table gives a site a
# draw on whether it installs at all (0.53: 10 of the crawl's 19 projects with
# five or more CP-type holes), then a share of its holes (0.43 to 1.0), and each
# hole draws against it. An installed hole has one installation, a 50 mm
# standpipe (plain, then slotted through the response zone) or a 19 mm
# piezometer (plain, then a 0.3 m tip written as SLOTTED), PIPE_REF 1, and its
# own BKFL in place of the site's: concrete cap, bentonite seal, a gravel or
# sand filter from 0.5 m above the slotted section to 0.5 m below it, bentonite
# to final depth, written even on a site whose holes carry no other BKFL. The
# zone starts at the first strike plus a drawn offset, or at a drawn depth when
# there is no strike, and is placed by depth alone. No MONG: it only restates
# PIPE. A preset without the table writes v6's bytes
# (a_preset_without_its_installation_writes_the_previous_versions_bytes); PIPE
# is written after the other construction groups. Forge analysis of the NE
# crawl's PIPE and BKFL (src/site/construction.rs,
# docs/research/tyneside-till-sources.md).
# v8 (#77): water strikes in till. Each till takes a strike table: a rate of
# strikes per metre penetrated (drawn once per site), a rise range with a skew
# and a share of strikes with no rise. A hole is a Poisson process along its
# penetration of each till (keyed by hole and unit): the first event below the
# stratum top is the strike, so it falls evenly through the stratum. A hole
# records one strike, the shallowest of a lens-top strike and a till strike; a
# water-table strike in a coarse stratum counts only when neither occurs. The
# water always rises by a draw in the unit's rise range, whatever the depth of
# the table, but not above ground level (a no-rise share stays at the strike).
# The table bounds nothing: the head on a parting in a clay till is not the
# site water table (forge judgement). The GFSG lens share is raised from 0.36
# to 0.44 so holes with the lens strike in it at the crawl's 36%.
# The rates are fitted so that the file's holes strike in WT, RT and GT at the
# crawl's 7.3%, 15.0% and 17.7% of holes through each unit (the file gives
# 7.3%, 14.9% and 17.7%); the grey till's rate is a quarter of the crawl's per
# metre because the file's holes cross 19 m of it against the crawl's 4.6 m.
# The rise is fitted to the crawl's pooled till strikes, over all of the
# file's till strikes (docs/research/tyneside-till-sources.md has the method
# and results).
# The basis is the crawl, plus the owner's practice note (forge judgement)
# that strikes in clay till come from thin sand or silt partings and fissures
# too small to log separately. WSTG, WSTD, WSTG_CAS, the BKFL zone and PIPE
# follow the strike and move with it; every other group is what v7 wrote
# (a_preset_without_its_till_strikes_writes_the_previous_versions_bytes).
schema = 1
name = "tyneside-till"
version = 8
summary = "Weathered, red and grey glacial till with a glaciofluvial sand and gravel lens, Tyneside, NE England."

[site]
extent_m = { x = 300.0, y = 200.0 }
ground_level_m = { min = 10.0, max = 60.0, basis = "forge judgement: a synthetic local datum, not a real elevation" }
groundwater_depth_m = { min = 2.9, max = 14.4, basis = "BGS NGDC AGS accessions 174059, 121869, 186814, 128125, 169655-7, 165950, 42158, 126770, 174053, 173968-71, 163688, 186779, 191205, 163846, 163546, 163565 and others (793 holes, 38 projects, NE England): depth to water 20 minutes after a strike in granular strata, P10-P90 2.9-14.4 m (n = 74), forge analysis. Contains data supplied by UKRI, OGL v3." }
strike_rise_m = { min = 0.2, max = 6.8, basis = "BGS NGDC AGS accessions 174059, 121869, 186814, 128125, 169655-7, 165950, 42158, 126770, 174053, 173968-71, 163688, 186779, 191205, 163846, 163546, 163565 and others (793 holes, 38 projects, NE England): strike depth minus the 20-minute level in granular strata, P10-P90 0.23-6.8 m (mean 2.5), forge analysis. Contains data supplied by UKRI, OGL v3." }

[[hole_types]]
code = "CP"
weight = 1
final_depth_m = { min = 15.0, max = 30.0, basis = "forge judgement: an investigation choice that passes through the weathered and red tills into the grey till, which is up to 40 m thick (Hughes et al. 1998, p.223); the site model has no bedrock. Cross-check: rockhead depth P10-P50-P90 3.5-10.9-27.8 m in BGS NGDC AGS accessions 174059, 121869, 186814, 128125, 169655-7, 165950, 42158, 126770, 174053, 173968-71, 163688, 186779, 191205, 163846, 163546, 163565 and others (200 holes reaching rock, 21 projects, NE England), forge analysis. Contains data supplied by UKRI, OGL v3." }

[[units]]
id = "WT"
name = "Weathered till"
thickness_m = { min = -8.8, max = 6.5, basis = "forge calibration to BGS NGDC AGS accessions 174059, 121869, 186814, 128125, 169655-7, 165950, 42158, 126770, 174053, 173968-71, 163688, 186779, 191205, 163846, 163546, 163565 and others (200 holes reaching rock, 21 projects, NE England), forge analysis: weathered till absent in 65% of holes, P10-P50-P90 0.75-1.8-3.9 m where present; range fitted to the absent share and P50 (the file gives 63% absent, 0.33-1.79-4.52 m). Contains data supplied by UKRI, OGL v3. Cross-check: weathering zones III-IV to 8 m at most (Eyles & Sladen 1981, Table 2, p.137); 'rarely exceeding 8 m' (Hughes et al. 1998, p.224)" }
description = { principals = ["CLAY"], secondaries = ["sand", "gravel", "silt"], colours = ["orangeish brown", "greyish brown", "brown"], very_coarse = { cobbles = "low", boulders = "low" } }
strike = { rate_per_m = { min = 0.0375, max = 0.0375, basis = "BGS NGDC AGS accessions 42158, 121869, 126770, 128125, 163546, 163688, 163846, 169722, 173968, 173969, 173971, 174053, 174059, 186779, 186814 and 188500 (NE England crawl, 793 holes, 38 projects), forge analysis: 19 of 260 holes through weathered till strike in it (7.3%, 10 projects), 0.31 strikes per 10 m penetrated (19 strikes in 621 m). Forge calibration: the rate is fitted so that the file's holes strike in weathered till at the crawl's 7.3% (the file gives 7.3%); it is 0.375 per 10 m because the file's holes cross less weathered till than the crawl's (2.0 m on average against 2.4 m). A strike is a Poisson event along the penetration, so it falls evenly through the stratum (crawl median 0.62 of the way down, n = 19). Only 5% of the crawl's weathered-till strikes have a logged sand or gravel parting, lens, pocket, lamina, band or layer in the description. Owner's practice note (forge judgement): strikes in clay till come from thin sand or silt partings and fissures too small to log separately. Context: thin sand and gravel lenses in till are frequently water-bearing, perched or sub-artesian (CIRIA C504 Fig 6.3, p.117; Eyles & Sladen 1981, p.134). Contains data supplied by UKRI, OGL v3." }, rise_m = { min = 0.1, max = 6.9, skew = 2.6, basis = "BGS NGDC AGS accessions 42158, 121869, 126770, 128125, 163546, 163688, 163846, 169722, 173968, 173969, 173971, 174053, 174059, 186779, 186814 and 188500 (NE England crawl, 793 holes, 38 projects), forge analysis: rise of till strikes, strike depth less the level 20 minutes after (else the last reading; WSTG has no rise column), n = 90 from 17 projects, P10-P50-P90 0.02-0.68-4.11 m, mean 1.74 m, 40% over 1 m, and 1 of 90 fell. Weathered till has only 10 readings (5 projects), so all three tills take these pooled figures (forge judgement; red till 44 readings 0.10-0.60-3.36 m, grey till 35 readings 0.00-0.90-5.90 m). Forge calibration: the water rises by a draw in this range whatever the depth of the water table, but not above ground level (the no-rise strikes are drawn apart), and the range and skew are fitted so that all of the file's till strikes give P50 0.68 m and P90 4.2 m (crawl 0.68 and 4.11 m; the file's mean is 1.43 m against 1.74 m and 42% over 1 m against 40%). Forge judgement: the table does not bound the rise, because in a clay till the head on a sand or silt parting is not the site water table, and the crawl's till strikes almost all rise (1 of 90 fell, 12% none). Contains data supplied by UKRI, OGL v3." }, no_rise_share = { min = 0.12, max = 0.12, basis = "BGS NGDC AGS accessions 42158, 121869, 126770, 128125, 163546, 163688, 163846, 169722, 173968, 173969, 173971, 174053, 174059, 186779, 186814 and 188500 (NE England crawl, 793 holes, 38 projects), forge analysis: 11 of 90 till strikes (12%) have a level within 0.05 m of the strike at 20 minutes or at the last reading (weathered 4 of 10, red 5% of 44, grey 14% of 35), pooled for all three tills because weathered till has only 10 readings. Forge calibration: the share of strikes drawn with no rise is fitted so that 12.4% of all the file's till strikes have a rise of 0.05 m or less (crawl 12%). Contains data supplied by UKRI, OGL v3." } }
sampling = { types = ["U", "D"], interval_m = { min = 1.0, max = 1.5, basis = "ICE Manual of Geotechnical Engineering Vol. 2, 2012, ch. 53, s53.7.2, p.791: sampling typically every 1.5 m" } }

[units.properties]
plastic_limit_percent = { min = 16.47, max = 24.02, basis = "forge calibration to Clarke et al. 2008 Table 1 p.71: upper red till PL mean 20.3, SD 2.8 (taken as the weathered till, forge judgement), under the LIMIT_COV scatter (the file gives mean 20.4, SD 2.9). Cross-check: BGS NGDC AGS accessions 174059, 163846, 169655, 186814, 174053, 186779, 165950 (till w n = 666, LL/PL n = 559), weathered till PL mean 19.8, forge analysis. Contains data supplied by UKRI, OGL v3." }
plasticity_index_percent = { min = 17.72, max = 34.52, basis = "forge calibration to Clarke et al. 2008 Table 1 p.71: upper red till LL mean 46.5, SD 6.6 (PI 26.2 derived from LL less PL), under the LIMIT_COV scatter (the file gives LL mean 46.5, SD 7.1). Cross-check: BGS NGDC AGS accessions 174059, 163846, 169655, 186814, 174053, 186779, 165950 (till w n = 666, LL/PL n = 559), weathered till LL mean 41.9, forge analysis. Contains data supplied by UKRI, OGL v3." }
liquidity_index = { min = -0.011, max = 0.109, basis = "forge calibration to Clarke et al. 2008 Table 1 p.71: upper red till w mean 21.5, SD 3.5 (LI 0.05 derived), under the MOISTURE_COV scatter (the file gives mean 21.5, SD 3.7). Cross-check: BGS NGDC AGS accessions 174059, 163846, 169655, 186814, 174053, 186779, 165950 (till w n = 666, LL/PL n = 559), weathered till w mean 20.6, forge analysis. Contains data supplied by UKRI, OGL v3. Context: Eyles & Sladen 1981 Table 3 p.138, zones III-IV, LI -0.15 to +0.30" }
particle_density_ratio = { min = 2.60, max = 2.70, basis = "Culshaw et al. 2017, doi:10.1144/EGSP28.6, Table 6.7 (Oadby Till Member, BGS Geotechnical Properties Database, n = 152: P10 2.60, P50 2.65, P90 2.70); CIRIA C504 (Trenter 1999), p.97 (typical 2.67). No NE England statistics were found; their use for the NE tills is forge judgement" }
strength = { relation = "cu.linear_with_depth", cu_top_kpa = { min = 39.9, max = 155.7, basis = "forge calibration to Clarke et al. 2008 Table 1 p.71: upper red till cu mean 99 kPa, SD 45 (n = 526; taken as the weathered till, forge judgement), under the STRENGTH_COV lognormal scatter (the file gives mean 98, SD 47). Cross-check: BGS NGDC AGS accessions 174059, 163846, 169655, 186814, 174053, 186779, 165950, weathered till cu mean 109 kPa (n = 20), forge analysis. Contains data supplied by UKRI, OGL v3." }, per_m = { min = 0, max = 0, basis = "Clarke et al. 2008 p.73: no trend of cu with depth; p.74: the characteristic strength profile is vertical" } }
triaxial = { multi_stage_share = { min = 0.49, max = 0.59, basis = "owner's practice note (forge judgement): labs run multi-stage UU where three matched 38 mm specimens can't be cut from a matrix-bound gravelly till. BGS NGDC AGS accessions 174059, 165950, 169655, 174053 and 186779 (NE England crawl, 32 UUM of 59 TRIG tests in 5 files, 0.54), forge analysis; the range is +-0.05 about it for site-to-site variation (forge judgement), the crawl's 5 files being too few to give a spread. Contains data supplied by UKRI, OGL v3." }, stage_gain = { min = 0.10, max = 0.30, basis = "forge calibration to BGS NGDC AGS accessions 174059, 165950 and 169655 (NE England crawl, 32 UUM sets of three stages in 3 files, 23 of them at cell pressures x1/x2/x4): cu of stage 2 and 3 over stage 1 has mean 1.19 and 1.40, median 1.11 and 1.21, giving a gain g with cu(k) = cu(1) x (1 + g x (k - 1)) of 0.20 (least squares over both stages, pooled mean; per-set median 0.11, P10-P90 0.01-0.47), forge analysis. Fitted mean 0.20, the range +-0.10 about it for site-to-site variation (forge judgement). Contains data supplied by UKRI, OGL v3." } }
effective_strength = { c_eff_kpa = { min = 3.45, max = 7.45, basis = "forge calibration to BGS NGDC AGS accessions 165950 and 174059 (NE England crawl, 3 weathered till TREG sets, 2 files): c' mean 5.3 kPa (SD 3.1), forge analysis; the range is 4.0 kPa wide for site-to-site variation (forge judgement), centred where the file's pooled TREG_COH matches the mean (c' is floored at 0 and a line that cuts below 0 is refitted through the origin, which lifts the file's mean), and each set scatters about the site's value with SD 2.0 kPa (forge judgement; src/site/effective.rs). The file's pooled TREG_COH is 5.3 kPa. Cross-check: Hashemi 2002 PhD (Univ. Newcastle), Table 5.1 p.91, Unit 1 (upper weathered till): Northumberland n = 27, c' mean 6.2 kPa (SD 5.3), phi' 23.3 deg (SD 9.2); Tyne and Wear with Durham n = 9, c' 11.9, phi' 27.0; CIRIA C504 (Trenter 1999), p.85: c' usually 0 to 25 kPa for clay tills (after Sladen and Wrigley 1983), the cap on this range. Contains data supplied by UKRI, OGL v3." }, phi_eff_deg = { min = 29.6, max = 33.6, basis = "forge calibration to BGS NGDC AGS accessions 165950 and 174059 (NE England crawl, 3 weathered till TREG sets, 2 files): phi' mean 31.1 deg (SD 2.4), forge analysis; the range is 4.0 deg wide for site-to-site variation (forge judgement), centred where the file's pooled TREG_PHI matches the mean, and each set scatters about the site's value with SD 1.5 deg (forge judgement; src/site/effective.rs). The file's pooled TREG_PHI is 31.1 deg. Cross-check: Hashemi 2002 PhD (Univ. Newcastle), Table 5.1 p.91, Unit 1 (upper weathered till): Northumberland n = 27, c' mean 6.2 kPa (SD 5.3), phi' 23.3 deg (SD 9.2); Tyne and Wear with Durham n = 9, c' 11.9, phi' 27.0; Hashemi's phi' values are 23 to 28 deg, so the crawl's weathered till at 31 deg sits above them. Contains data supplied by UKRI, OGL v3." }, skempton_af = { min = 0.09, max = 0.29, basis = "forge calibration to BGS NGDC AGS accessions 165950 (NE England crawl, 2 CUM sets, 6 stages 