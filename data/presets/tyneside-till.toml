# Testing rates. Each SAMP-child rate is sized so the smallest default site
# (3 holes) meets Decoding Eurocode 7's "no comparable experience" minimum
# per stratum in the till on every seed, which a test holds. Decoding EC7 does
# not define "stratum". The weathered and red tills are too thin or too often
# absent to meet a minimum on their own (absent from about 63% and 43% of
# holes), and even the grey till falls short on a few 3-hole sites (about 0.3%
# over 5,000 seeds), so WT, RT and GT count together as one till stratum, as
# Eyles & Sladen 1981 (pp.134-135) read the reddened till as the weathered top
# of one lodgement till: forge judgement.

[[suite]]
group = "LNMC"
headings = ["LNMC_MC"]
units = ["WT", "RT", "GT"]
rate = { min = 0.7, max = 1.0, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, water contents at least the Atterberg count (3) per stratum, WT, RT and GT together as one till stratum (forge judgement); sized so a 3-hole site meets it (forge analysis), and above the LLPL rate so water contents outnumber Atterberg tests on average" }

[[suite]]
group = "LLPL"
headings = ["LLPL_LL", "LLPL_PL", "LLPL_PI"]
units = ["WT", "RT", "GT"]
rate = { min = 0.3, max = 0.45, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, at least 3 Atterberg tests per stratum, WT, RT and GT together as one till stratum (forge judgement); sized so a 3-hole site meets it (forge analysis)" }

[[suite]]
group = "LDEN"
headings = ["LDEN_BDEN", "LDEN_DDEN", "LDEN_MC"]
units = ["WT", "RT", "GT"]
rate = { min = 0.5, max = 0.7, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, at least 3 bulk densities per stratum, WT, RT and GT together as one till stratum (forge judgement); sized so a 3-hole site meets it on U samples alone (forge analysis)" }

[[suite]]
group = "TRIG"
headings = []
units = ["WT", "RT", "GT"]
rate = { min = 0.5, max = 0.7, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, at least 3 triaxial cu tests per stratum, WT, RT and GT together as one till stratum (forge judgement); sized so a 3-hole site meets it on U samples alone (forge analysis)" }

[[suite]]
group = "TRIT"
headings = ["TRIT_CU", "TRIT_DEVF", "TRIT_CELL", "TRIT_BDEN", "TRIT_IMC"]

[[suite]]
group = "ISPT"
headings = ["ISPT_NVAL", "ISPT_MAIN", "ISPT_NPEN", "ISPT_REP"]
units = ["WT", "RT", "GT", "GFSG"]
rate = { min = 1.0, max = 1.0, basis = "Decoding Eurocode 7 (Bond and Harris, 2008) gives no SPT frequency; ICE Manual of Geotechnical Engineering Vol. 1, 2012, p.630: SPTs 'typically every 1.5 m'. An SPT at every D sample follows the sampling interval (forge judgement)" }

[[suite]]
group = "WSTG"
headings = []

[[suite]]
group = "WSTD"
headings = []

