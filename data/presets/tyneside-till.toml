S accessions 169655, 174053 and 174059 (NE England crawl, 7 CU and CUM sets, 17 stages of CU and CUM, 3 files): A_f = (PWPF - PWPI) / DEVF per stage has mean 0.459 (SD 0.277), forge analysis; the range is 0.2 wide for site-to-site variation (forge judgement), centred where the file's pooled A_f matches the mean, and each stage scatters about the site's value with SD 0.10 (forge judgement). The file's pooled A_f is 0.47. No published A_f was found for these tills. Contains data supplied by UKRI, OGL v3." } }
