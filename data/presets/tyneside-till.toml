thickness_m = { min = 0.3, max = 3.6, basis = "BGS NGDC AGS accessions 174059, 121869, 186814, 128125, 169655-7, 165950, 42158, 126770, 174053, 173968-71, 163688, 186779, 191205, 163846, 163546, 163565 and others (793 holes, 38 projects, NE England): glaciofluvial layers within till, P10-P90 0.30-3.6 m (n = 169, 28 projects), forge analysis, taken as the range of the centre thickness (forge judgement; the taper thins the written strata to P10-P50-P90 about 0.16-0.84-2.24 m). Contains data supplied by UKRI, OGL v3. Cross-check: mostly under 1 m (Hughes et al. 1998, p.223); usually under 1.5 m, at most 12 m (Eyles & Sladen 1981, p.134)" }
