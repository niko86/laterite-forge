spt = { relation = "spt.stroud_butler", f1 = { min = 4.4, max = 5.2, basis = "CIRIA C504 (Trenter 1999), p.82: Stroud and Butler 1975, f1 5.2 for tills of PI 25 or less; p.83 and Table 4.5: Northern Ireland, Case Study 13, average 4.4; ICE Manual of Geotechnical Engineering Vol. 1, 2012, ch. 31, Fig. 31.14, p.378: 4.9 for northern England. C504 finds f1 site-specific. Cross-check: SPT N in weathered till, refusals excluded, mean 22.6 (167 tests, 24 projects) in BGS NGDC AGS accessions 174059, 121869, 186814, 128125, 169655-7, 165950, 42158, 126770, 174053, 173968-71, 163688, 186779, 191205, 163846, 163546, 163565 and others (793 holes, 38 projects, NE England), forge analysis. Contains data supplied by UKRI, OGL v3." }, refusal_share = { min = 0.055, max = 0.165, basis = "forge calibration to BGS NGDC AGS accessions 174059, 121869, 186814, 128125, 169655-7, 165950, 42158, 126770, 174053, 173968-71, 163688, 186779, 191205, 163846, 163546, 163565 and others (793 holes, 38 projects, NE England): refusals (N of 50 or more, a * in ISPT_REP, or a main drive under 300 mm) in weathered till, 20 of 167 tests (12%; 24 projects; per-project rates 0.00-0.40), forge analysis. The share is the obstruction (cobble and boulder) refusals only; strength refusals (any drawn N of 50 or more) come on top and the share is fitted so the total matches: the crawl gives 12%, the file gives 12.0%. Fitted mean 0.11, the range +-50% about it for site-to-site variation (forge judgement). The refusal convention (N 50 not extrapolated, MAIN 50, NPEN 150 + p, REP 50/p) is forge judgement (owner decision, niko86/laterite-forge#63). Contains data supplied by UKRI, OGL v3." } }

[[units]]
id = "RT"
name = "Red till"
thickness_m = { min = -1.85, max = 19.25, skew = 3.1, basis = "forge calibration to BGS NGDC AGS accessions 174059, 121869, 186814, 128125, 169655-7, 165950, 42158, 126770, 174053, 173968-71, 163688, 186779, 191205, 163846, 163546, 163565 and others (200 holes reaching rock, 21 projects, NE England), forge analysis: red and brown till absent in 42% of holes, P10-P50-P90 0.67-3.3-11.0 m where present; range and skew fitted to these (the file gives 43% absent, 0.47-3.15-10.2 m). Contains data supplied by UKRI, OGL v3. Cross-check: reddened profile 3-8 m (Eyles & Sladen 1981, pp.134-136)" }
description = { principals = ["CLAY"], secondaries = ["sand", "gravel", "silt"], colours = ["dark reddish brown", "reddish brown"], very_coarse = { cobbles = "low", boulders = "low" } }
strike = { rate_per_m = { min = 0.0425, max = 0.0425, basis = "BGS NGDC AGS accessions 42158, 121869, 126770, 128125, 163546, 163688, 163846, 169722, 173968, 173969, 173971, 174053, 174059, 186779, 186814 and 188500 (NE England crawl, 793 holes, 38 projects), forge analysis: 51 of 339 holes through red and brown till strike in it (15.0%, 16 projects), 0.32 strikes per 10 m penetrated (59 strikes in 1,849 m). Forge calibration: the rate is fitted so that the file's holes strike in red till at the crawl's 15.0% (the file gives 14.9%); it is 0.425 per 10 m because the file's holes cross less red till than the crawl's (4.2 m on average against 5.5 m) and one strike per hole lets a shallower weathered-till strike take precedence. A strike is a Poisson event along the penetration, so it falls evenly through the stratum (crawl median 0.55 of the way down, n = 59). Only 14% of the crawl's red-till strikes have a logged sand or gravel parting, lens, pocket, lamina, band or layer in the description (24% any parting, lens, pocket or band word). Owner's practice note (forge judgement): strikes in clay till come from thin sand or silt partings and fissures too small to log separately. Context: thin sand and gravel lenses in till are frequently water-bearing, perched or sub-artesian (CIRIA C504 Fig 6.3, p.117; Eyles & Sladen 1981, p.134). Contains data supplied by UKRI, OGL v3." }, rise_m = { min = 0.1, max = 6.9, skew = 2.6, basis = "BGS NGDC AGS accessions 42158, 121869, 126770, 128125, 163546, 163688, 163846, 169722, 173968, 173969, 173971, 174053, 174059, 186779, 186814 and 188500 (NE England crawl, 793 holes, 38 projects), forge analysis: rise of till strikes, strike depth less the level 20 minutes after (else the last reading; WSTG has no rise column), n = 90 from 17 projects, P10-P50-P90 0.02-0.68-4.11 m, mean 1.74 m, 40% over 1 m, and 1 of 90 fell. Weathered till has only 10 readings (5 projects), so all three tills take these pooled figures (forge judgement; red till 44 readings 0.10-0.60-3.36 m, grey till 35 readings 0.00-0.90-5.90 m). Forge calibration: the water rises by a draw in this range whatever the depth of the water table, but not above ground level (the no-rise strikes are drawn apart), and the range and skew are fitted so that all of the file's till strikes give P50 0.68 m and P90 4.2 m (crawl 0.68 and 4.11 m; the file's mean is 1.43 m against 1.74 m and 42% over 1 m against 40%). Forge judgement: the table does not bound the rise, because in a clay till the head on a sand or silt parting is not the site water table, and the crawl's till strikes almost all rise (1 of 90 fell, 12% none). Contains data supplied by UKRI, OGL v3." }, no_rise_share = { min = 0.12, max = 0.12, basis = "BGS NGDC AGS accessions 42158, 121869, 126770, 128125, 163546, 163688, 163846, 169722, 173968, 173969, 173971, 174053, 174059, 186779, 186814 and 188500 (NE England crawl, 793 holes, 38 projects), forge analysis: 11 of 90 till strikes (12%) have a level within 0.05 m of the strike at 20 minutes or at the last reading (weathered 4 of 10, red 5% of 44, grey 14% of 35), pooled for all three tills because weathered till has only 10 readings. Forge calibration: the share of strikes drawn with no rise is fitted so that 12.4% of all the file's till strikes have a rise of 0.05 m or less (crawl 12%). Contains data supplied by UKRI, OGL v3." } }
sampling = { types = ["U", "D"], interval_m = { min = 1.0, max = 1.5, basis = "ICE Manual of Geotechnical Engineering Vol. 2, 2012, ch. 53, s53.7.2, p.791: sampling typically every 1.5 m" } }

