boundary_m = { min = 0.2, max = 1.4, basis = "BGS NGDC AGS accessions of the London crawls that hold BKFL, listed under site_share: depth of the base of the arisings over bentonite, P10 0.2 m, P50 1.0 m, P90 1.2 m (n = 11 holes, so a linear range over the crawl's spread; forge analysis). Contains data supplied by UKRI, OGL v3." }

[construction.installation]
site_share = { min = 0.17, max = 0.17, basis = "BGS NGDC AGS accessions of the London crawls that hold PIPE (39638, 40721, 83329, 111549, 126770, 162465, 168212, 173376, 185575, 188520, 188540, 188542, 192298, 192311, 192312, 192346, 192401 and others): of 18 projects with five or more CP-type holes, 3 have PIPE in their CP-type holes (50%, 93% and 93%) and 15 in none, so 3 of 18 sites install (0.17; files de-duplicated by content, forge analysis). The London crawls were selected for water strikes and sequences, not installations, so this is a small sample. Forge calibration to the crawl: over 6,000 seeds 1,005 sites (0.17) install at least one hole. Contains data supplied by UKRI, OGL v3." }
hole_share = { min = 0.43, max = 1.0, basis = "BGS NGDC AGS accessions of the London crawls that hold PIPE, listed under site_share: the three projects that install have PIPE in 0.50, 0.93 and 0.93 of their CP-type holes (forge analysis). Three projects are too few to fit; forge judgement: the range of the NE England crawl's 10 installing projects (0.43 to 1.0, tyneside-till), which contains all three, drawn uniformly. Forge calibration: over 6,000 seeds an installing site installs 0.72 of its holes and the file installs 0.12 of all its holes (crawl: PIPE in 89 of 632 London holes with GEOL, 0.14, of every hole type). Contains data supplied by UKRI, OGL v3." }
kinds = [
    { kind = "standpipe", mm = 50, weight = 46 },
    { kind = "piezometer", mm = 19, weight = 20 },
]
kinds_basis = "BGS NGDC AGS accessions of the London crawls that hold PIPE, listed under site_share: of 89 holes with PIPE, 46 have a 50 mm pipe (a standpipe) and 20 a 19 mm one (a standpipe piezometer); 23 hold 25, 24, 70 or 90 mm pipe or record no diameter and are left out (forge analysis). A standpipe is plain from the surface to the top of the response zone and slotted through it. A piezometer is plain, then a 0.3 m tip written as SLOTTED, because the dictionary's PIPE_TYPE has only PLAIN and SLOTTED (the 0.3 m tip is the NE England crawl's measurement, n = 43; the London crawls have no tip rows to measure, forge judgement). Craig's Soil Mechanics, 7th ed., 2004, pp.405-406: an open standpipe is normally plastic tube of 50 mm or smaller with the lower end perforated or fitted with a porous element, sand or fine gravel packed around that end, a bentonite seal immediately above, the rest of the hole backfilled and a second seal near the surface (forge judgement for the construction). Forge calibration to the crawl: over 6,000 seeds 69.8% of installations are standpipes (crawl 46 of 66, 69.7%). Contains data supplied by UKRI, OGL v3."
zone_offset_m = { min = -4.54, max = 6.0, skew = 1.75, basis = "BGS NGDC AGS accessions of the London crawls that hold PIPE, listed under site_share: top of the slotted section less the depth of the hole's first strike, P10 -4.35 m, P50 -1.4 m, P90 +4.25 m (n = 12 holes with a strike, of 18 with a slotted section), forge analysis. Range and skew fitted to these, a small sample; forge calibration to the crawl: file P10 -4.1 m, P50 -1.4 m, P90 +4.0 m (6,000 seeds, 1,900 holes with a strike). A hole whose strike is not in the file draws its zone top from zone_top_m. Contains data supplied by UKRI, OGL v3." }
zone_top_m = { min = 0.9, max = 8.0, skew = 2.3, basis = "BGS NGDC AGS accessions of the London crawls that hold PIPE, listed under site_share: top of the slotted section in the 6 holes with a slotted section and no recorded strike, P10 1.1 m, P50 2.35 m, P90 6.5 m, forge analysis (a very small sample). Range and skew fitted to these; forge calibration to the crawl: file P10 1.20 m (a zone cannot start above the 1.2 m inspection pit base), P50 2.30 m, P90 6.40 m (6,000 seeds, 1,768 holes). No targeting of strata (forge judgement): the 18 London zones lie over sand and gravel in 8, made ground in 4, fine ground in 4 and rock in 1 (a keyword classification of GEOL_DESC), too few to draw from, so the zone is placed by depth alone. Contains data supplied by UKRI, OGL v3." }
slotted_length_m = { min = 0.9, max = 9.7, skew = 2.1, basis = "BGS NGDC AGS accessions of the London crawls that hold PIPE, listed under site_share: length of the SLOTTED rows, P10 1.0 m, P50 3.0 m, P90 8.0 m (n = 21 rows), forge analysis. Range and skew fitted to these; forge calibration to the crawl: file P10 0.99 m, P50 2.92 m, P90 7.86 m (6,000 seeds, 2,560 standpipes). A piezometer's tip is 0.3 m and does not draw from this. Contains data supplied by UKRI, OGL v3." }
base_gap_m = { min = 0.5, max = 12.0, skew = 2.9, basis = "BGS NGDC AGS accessions of the London crawls that hold PIPE, listed under site_share: final depth less the deepest PIPE_BASE, P10 0.0 m, P50 2.0 m, P90 28.0 m (n = 89 holes with a base), forge analysis. In the file this is a ceiling: the zone sits between the pit base and the final depth less this gap (raised to the 0.6 m the filter and bentonite tail need, which covers the crawl's P10). The range and skew are fitted to the crawl's median and cut off at 12 m, so the file's drawn gap is P10 0.5 m, P50 2.0 m, P90 9.0 m (forge judgement: a longer ceiling gap would pull zones in this site's 20-40 m holes above the strikes they follow). The ceiling rarely binds, because the zone is placed from its top: the file's final depth less zone base is P10 13.8 m, P50 23.2 m, P90 32.5 m, in holes deeper than the crawl's (forge calibration). Contains data supplied by UKRI, OGL v3." }
cap_m = { min = 0.5, max = 0.5, basis = "BGS NGDC AGS accessions of the London crawls that hold both PIPE and BKFL (all 17 listed under site_share): the concrete (906) layer from the surface in holes with PIPE, P10 0.2 m, P50 0.5 m, P90 1.0 m (n = 45 holes), forge analysis. Forge judgement: 0.5 m in every installed hole, the median. Contains data supplied by UKRI, OGL v3." }
filter = { weights = [14, 1], basis = "BGS NGDC AGS accessions of the London crawls that hold both PIPE and BKFL, listed under cap_m: of 15 holes whose slotted section lies inside a gravel (902) or sand (901) layer, 14 have gravel and 1 sand, forge analysis (a very small sample). The filter runs 0.5 m above the slotted section to 0.5 m below it and the layers above and below it are bentonite (903) to the final depth; forge judgement: the NE England crawl's filter overlap (-0.5 m above and +0.5 m below, n = 178 holes) and Craig's Soil Mechanics, 7th ed., 2004, pp.405-406 for the construction, because the London crawl's 18 holes with a measurable pack are too few. Forge calibration to the crawl: gravel in 92.8% of installed holes in the file. Contains data supplied by UKRI, OGL v3." }
