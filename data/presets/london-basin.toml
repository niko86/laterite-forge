# london-basin: Made Ground over River Terrace Deposits over weathered and
# unweathered London Clay (ADR 0001, #24, #48, #42). Every range carries its
# basis. A basis names the source as found (book, edition, chapter, printed
# page, table) and the original paper where the book names one. "forge judgement" marks a value
# that describes the synthetic site or a modelling choice, not the ground.
# "calibrated (forge analysis)" marks a range tuned so that the values the
# file writes, pooled over many seeds, match the named source's mean and
# spread (docs/research/london-basin-sources.md has the method and results).
#
# Versioning: from v3, any change to what this preset generates bumps
# `version`, and consumers are told and re-baseline (ADR 0001).
#
# Description constraints (not ranges, so they carry no basis field) follow
# these sources:
# - Made Ground: principals CLAY, GRAVEL and SAND (36%, 29% and 29% of 1,288
#   Made Ground soil strata in the BGS Made Ground accessions below, forge
#   analysis); secondaries sand, gravel and clay (commonest forms gravelly
#   sandy CLAY, clayey gravelly SAND, clayey sandy GRAVEL, sandy GRAVEL);
#   colours the six commonest first colour phrases (brown, dark brown, dark
#   grey, light brown, grey, black: 68% of strata). Normal soil terms first,
#   then the man-made constituents (Norbury, Soil and Rock Description in
#   Engineering Practice, 2010, ch. 14, pp.212-214; example p.214: "MADE
#   GROUND: dense brown sandy GRAVEL with occasional tiles, wire, glass,
#   tyres").
# - RTD: light brown, slightly sandy flint GRAVEL (ICE Manual of Geotechnical
#   Engineering Vol. 1, 2012, ch. 13, Fig. 13.1(a), p.142); brown fine to
#   medium sand and gravel (same, ch. 4, Fig. 4.4, p.21).
# - Weathered London Clay: brown silty CLAY (ICE Vol. 1, ch. 13, Fig. 13.1(a),
#   p.142); weathered "brown" against unweathered "blue" (Head, Manual of Soil
#   Laboratory Testing Vol. 2, 2nd ed., Table 14.5, p.372); orange-mottled
#   brown (Head Vol. 1, 3rd ed., Table 7.1, p.371).
# - London Clay: grey silty CLAY (ICE Vol. 1, ch. 13, Fig. 13.1(a), p.142);
#   blue grey fissured silty clay (ICE Vol. 1, ch. 36, Table 36.2, p.496,
#   after Czerewko et al. 2003a; BGS Lexicon, London Clay Formation).
#
# Sources of the v3 and v4 values (each range names the ones it uses):
# - Brosse, Lo, Davis & Che (2025), Revisiting of London Clay simple
#   correlations using a Bayesian approach, Proc. 9th ISGSR, pp. 867-871,
#   doi:10.3850/GRF-25280825_isgsr-185-P110-cd (2,015 Crossrail UU tests).
# - Jones & Terrington (2011), Modelling volume change potential in the London
#   Clay, QJEGH 44(1):109-122, doi:10.1144/1470-9236/08-112.
# - Royse, Rutter & Entwisle (2009), Property attribution of 3D geological
#   models in the Thames Gateway, London, Bull. Eng. Geol. Env. 68(1),
#   doi:10.1007/s10064-008-0171-0.
# - Skempton & Henkel (1957), Tests on London Clay from deep borings at
#   Paddington, Victoria and the South Bank, Proc. 4th ICSMFE, London.
# - ISSMGE-TC304 (2021), State-of-the-art review of inherent variability and
#   uncertainty in geotechnical properties and models, doi:10.53243/R0001
#   (Appendix: Cooling & Skempton, London Clay PL).
# - Bond and Harris (2008), Decoding Eurocode 7, ch. 4, s4.5.4, Figs 4.14 and
#   4.15, p.108, and Example 4.3, p.124 (minimum tests per stratum).
# - BGS National Geotechnical Data Centre AGS accessions, forge analysis of two
#   crawls (docs/research/london-basin-sources.md). Index properties:
#   128985 (Tideway West) and 129866 (West Drayton); terrace-gravel SPT N:
#   128985, 126770, 129866, 121953; water strikes: 163306, 39638, 162465,
#   167350, 167349, 167292, 167290, 83329, 167414, 167131, 168650, 162665,
#   164271, 185262, 192346. Made Ground (v4): the 80 accessions of the two
#   crawls, 663 holes from 126 projects: 39638, 40721, 81109, 81709, 83329,
#   107613, 111549, 121953, 126770, 128985, 129866, 133106, 138366, 138585,
#   138586, 140725, 140726, 141089, 141090, 161518, 161519, 161567, 161905,
#   162207, 162345, 162409, 162410, 162465, 162565, 162665, 162765, 163045,
#   163306, 163405, 164270, 164271, 166866, 167034, 167131, 167132, 167290,
#   167291, 167292, 167344, 167345, 167346, 167347, 167348, 167349, 167350,
#   167413, 167414, 167415, 167951, 167952, 167953, 167954, 168212, 168533,
#   168549, 168650, 168963, 168964, 169038, 169571, 169573, 173376, 185262,
#   185575, 186926, 188520, 188540, 188542, 190850, 190946, 192298, 192311,
#   192312, 192346, 192401. Open Government Licence v3. Contains data supplied
#   by UKRI.
# - Terrington, Silva, Waters, Smith & Thorpe (2018), Geomorphology
#   319:15-34, doi:10.1016/j.geomorph.2018.07.005.
# - Ford, Price, Cooper & Waters (2014), Geol. Soc. London Spec. Publ.
#   395:55-89, doi:10.1144/SP395.12.
#
# v2 context, kept for reference: RTD N 10-30 (Craig's Soil Mechanics 7th
# ed., ch. 8, Table 8.3, p.298, medium dense, after Terzaghi and Peck; logged
# N 15 in terrace gravel, ICE Vol. 1, ch. 13, Fig. 13.1(a), p.142); clay
# plasticity and liquidity from ICE Vol. 2, ch. 53, Table 53.7, p.784 and ICE
# Vol. 1, ch. 36, Table 36.3, p.498, after Cripps and Taylor 1981 and others.
#
# Made Ground (v4, #42) is a mixed unit: CLAY-led strata take their
# consistency term from the fine set (Ic = 1 - LI) and SAND- or GRAVEL-led
# strata their density term from the coarse set's SPT N. Both sets are forge
# judgement, as the BGS exports carry no lab data on Made Ground, calibrated
# (forge analysis) so the leading terms come out in about the BGS
# proportions. A mixed unit takes its moisture content (so its bulk density,
# and the overburden below it) from the fine set; the coarse set's moisture
# content is required by the loader but not read. Every Made Ground SPT,
# CLAY-led or not, writes the coarse set's N. Made Ground takes no lab tests
# (the loader refuses them) and never yields a water strike. Its thickness is
# a skewed range (ADR 0001, "Ground") fitted to the BGS P10, P50, P90 and
# absent share; the field is compressed, so the fit is a compromise, chosen
# to keep the no-strike share inside the BGS 32-46%.
#
# The suite lists no LNMC in RTD: its B and D samples are quality class 4 and
# LNMC needs class 3 (data/sample-quality/table.json), so RTD could carry no
# LNMC row.
schema = 1
name = "london-basin"
version = 4
summary = "Made Ground over River Terrace Deposits over weathered and unweathered London Clay, London Basin."

[site]
extent_m = { x = 300.0, y = 200.0 }
ground_level_m = { min = 5.0, max = 30.0, basis = "forge judgement: a synthetic local datum, not a real elevation" }
groundwater_depth_m = { min = 2.7, max = 7.2, basis = "BGS NGDC AGS water-strike accessions listed above: depth to water 20 minutes after the strike, P10-P90 2.70-7.24 m (n = 25, 11 projects), forge analysis. Contains data supplied by UKRI, OGL v3" }
strike_rise_m = { min = 0.0, max = 2.6, basis = "BGS NGDC AGS water-strike accessions listed above: strike depth minus the 20-minute level, P10-P90 0.02-2.62 m (n = 25, 11 projects), forge analysis. Contains data supplied by UKRI, OGL v3" }

[[hole_types]]
code = "CP"
weight = 1
final_depth_m = { min = 20.0, max = 40.0, basis = "forge judgement: an investigation choice; within the 50-60 m percussion boreholes generally reach (Craig's Soil Mechanics, 7th ed., 2004, s10.2, p.376)" }

[[units]]
id = "MG"
name = "Made Ground"
thickness_m = { min = -1.0, max = 5.75, skew = 1.3, basis = "BGS NGDC AGS Made Ground accessions listed above: Made Ground over terrace gravel over London Clay, P10-P90 0.71-4.58 m, P50 1.86 m, about 10% absent (n = 102, 36 projects; Made Ground or fill in the surface sequence of 89.9% of 663 holes); range and skew fitted to these (forge analysis; the file gives P10-P50-P90 about 0.49-1.92-3.90 m, 10% absent; the best unconstrained fit, -0.6 to 6.75 at skew 1.7, lifts the no-strike share above the BGS 46%; docs/research/london-basin-sources.md). Contains data supplied by UKRI, OGL v3. Cross-checks: Terrington et al. 2018, doi:10.1016/j.geomorph.2018.07.005, Table 5 (mean over terrace deposits 2.21-3.19 m); Ford et al. 2014, doi:10.1144/SP395.12, Table 1 (made ground mean 1.4 m, SD 2.6)" }
description = { principals = ["CLAY", "GRAVEL", "SAND"], secondaries = ["sand", "gravel", "clay"], colours = ["brown", "dark brown", "dark grey", "grey", "black", "light brown"] }
sampling = { types = ["B", "D"], interval_m = { min = 1.0, max = 1.5, basis = "ICE Manual of Geotechnical Engineering Vol. 2, 2012, ch. 53, s53.7.2, p.791: sampling typically every 1.5 m; Craig's Soil Mechanics, 7th ed., 2004, ch. 8, p.297: SPT every 0.75-1.5 m" } }

[units.made_ground]
constituents = [
    { name = "brick", share = 0.68, basis = "BGS NGDC AGS Made Ground accessions listed above: brick named in 879 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
    { name = "concrete", share = 0.39, basis = "BGS NGDC AGS Made Ground accessions listed above: concrete named in 498 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
    { name = "clinker", share = 0.15, basis = "BGS NGDC AGS Made Ground accessions listed above: clinker named in 196 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
    { name = "ash", share = 0.13, basis = "BGS NGDC AGS Made Ground accessions listed above: ash named in 167 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
    { name = "pottery", share = 0.1, basis = "BGS NGDC AGS Made Ground accessions listed above: pottery, ceramic or tile named in 134 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
    { name = "glass", share = 0.078, basis = "BGS NGDC AGS Made Ground accessions listed above: glass named in 101 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
    { name = "timber", share = 0.075, basis = "BGS NGDC AGS Made Ground accessions listed above: wood or timber named in 97 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
    { name = "metal", share = 0.063, basis = "BGS NGDC AGS Made Ground accessions listed above: metal named in 81 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
    { name = "coal", share = 0.057, basis = "BGS NGDC AGS Made Ground accessions listed above: coal named in 73 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
    { name = "slag", share = 0.042, basis = "BGS NGDC AGS Made Ground accessions listed above: slag named in 54 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
    { name = "plastic", share = 0.038, basis = "BGS NGDC AGS Made Ground accessions listed above: plastic named in 49 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
    { name = "tarmacadam", share = 0.033, basis = "BGS NGDC AGS Made Ground accessions listed above: tarmac or asphalt named in 42 of 1,288 Made Ground soil strata (85 projects), forge analysis, contains data supplied by UKRI, OGL v3" },
]
count = { weights = [0.20, 0.30, 0.27, 0.23], basis = "BGS NGDC AGS Made Ground accessions listed above: of 1,288 Made Ground soil strata, 20% name none of these twelve constituents, 30% one, 27% two and 23% three or more, forge analysis, contains data supplied by UKRI, OGL v3" }
amounts = { weights = [0.14, 0.25, 0.07, 0.0, 0.02], basis = "BGS NGDC AGS Made Ground accessions listed above: share of 1,288 Made Ground soil strata using each amount word (rare 13.9%, occasional 25.1%, frequent 6.8%, numerous 0%, abundant 1.7%), forge analysis, contains data supplied by UKRI, OGL v3" }

[units.properties]
plastic_limit_percent = { min = 20, max = 26, basis = "forge judgement: the BGS exports carry no lab data on Made Ground; a reworked clay matrix at or a little below London Clay's PL 26. It feeds only the moisture content behind bulk density (the overburden below), since the loader refuses lab groups over Made Ground" }
plasticity_index_percent = { min = 20, max = 35, basis = "forge judgement: the BGS exports carry no lab data on Made Ground; a reworked clay matrix below London Clay's PI 44, for its sand and gravel. It feeds only the moisture content behind bulk density (the overburden below)" }
liquidity_index = { min = 0.1, max = 0.9, basis = "forge judgement (the BGS exports carry no lab data on Made Ground), calibrated (forge analysis) so CLAY-led Made Ground leads soft and firm in about equal shares, with a little stiff (BGS NGDC AGS Made Ground accessions listed above: soft 15%, firm 13%, stiff 4% of 1,288 Made Ground soil strata, forge analysis, contains data supplied by UKRI, OGL v3)" }
spt_n = { min = 3, max = 18, basis = "forge judgement (the BGS exports carry no lab data on Made Ground), calibrated (forge analysis) so SAND- and GRAVEL-led Made Ground leads loose and medium dense in about equal shares (BGS NGDC AGS Made Ground accessions listed above: loose 6%, medium dense 6% of 1,288 Made Ground soil strata, forge analysis, contains data supplied by UKRI, OGL v3). Cross-check: SPT N in Made Ground in the same accessions, refusals excluded, mean 12.5, P10-P50-P90 3-10-25 (n = 434, 30 projects), forge analysis" }
moisture_content_percent = { min = 10, max = 20, basis = "forge judgement; not read, because a unit with a fine principal takes its moisture content from the fine set" }
particle_density_ratio = { min = 2.60, max = 2.70, basis = "Head, Manual of Soil Laboratory Testing Vol. 1, 3rd ed., Table 3.1, p.126 (kaolinite 2.6, quartz 2.65). Mineral values; their use for Made Ground, whose brick, ash and clinker are not minerals, is forge judgement" }

[[units]]
id = "RTD"
name = "River Terrace Deposits"
thickness_m = { min = -2.0, max = 9.0, basis = "BGS Lexicon of Named Rock Units, Taplow Gravel Member (TPGR): average 5 m, locally to 9 m; Kempton Park Gravel Member (KPGR): average 6 m. Minimum below zero: forge judgement, modelling patchy terrace cover" }
description = { principals = ["GRAVEL", "SAND"], secondaries = ["sand", "gravel"], colours = ["light brown", "brown"] }
sampling = { types = ["B", "D"], interval_m = { min = 1.0, max = 1.5, basis = "ICE Manual of Geotechnical Engineering Vol. 2, 2012, ch. 53, s53.7.2, p.791: sampling typically every 1.5 m; Craig's Soil Mechanics, 7th ed., 2004, ch. 8, p.297: SPT every 0.75-1.5 m" } }

[units.properties]
spt_n = { min = 17, max = 37, basis = "Royse, Rutter & Entwisle 2009, doi:10.1007/s10064-008-0171-0, Fig. 4 (terrace gravels, median about 30, mostly N 10-50; COV about 0.5 derived); calibrated (forge analysis) to mean about 27, COV 0.40-0.50 with SPT_COV. Cross-check: BGS NGDC AGS accessions 128985, 126770, 129866, 121953 (terrace gravel over London Clay, mean 26.8, COV 0.39, n = 142), forge analysis, contains data supplied by UKRI, OGL v3" }
moisture_content_percent = { min = 5, max = 15, basis = "forge judgement" }
particle_density_ratio = { min = 2.64, max = 2.66, basis = "Head, Manual of Soil Laboratory Testing Vol. 1, 3rd ed., Table 3.1, p.126 (quartz 2.65)" }

[[units]]
id = "WLC"
name = "Weathered London Clay"
thickness_m = { min = -1.0, max = 3.0, basis = "Skempton & Henkel 1957, Proc. 4th ICSMFE: under the terrace gravels the brown clay 'is rarely more than a few feet thick, and sometimes entirely absent' (a cap of about 1 m); the spread about it and the minimum below zero (absent in places) are forge judgement" }
description = { principals = ["CLAY"], secondaries = ["silt"], colours = ["brown", "orangeish brown", "light brown"] }
sampling = { types = ["U", "D"], interval_m = { min = 1.0, max = 1.5, basis = "ICE Manual of Geotechnical Engineering Vol. 2, 2012, ch. 53, s53.7.2, p.791: sampling typically every 1.5 m" } }

[units.properties]
plastic_limit_percent = { min = 25, max = 27, basis = "Skempton & Henkel 1957, Table 1 (PL about 26 at all depths); Cooling & Skempton, London PL n = 100, mean 26.7, COV 9.4% (ISSMGE-TC304 2021, doi:10.53243/R0001, Appendix); calibrated (forge analysis) to mean 26, COV about 0.09 with LIMIT_COV. Cross-check: BGS NGDC AGS accessions 128985, 129866 (weathered PL mean 26.3, COV 0.079, n = 79), forge analysis, contains data supplied by UKRI, OGL v3" }
plasticity_index_percent = { min = 36, max = 52, basis = "Jones & Terrington 2011, doi:10.1144/1470-9236/08-112, Table 1, area 3a, central London (modified PI, n = 7,460: mean 44, P10-P90 33-54); calibrated (forge analysis) to that mean and P10-P90 with LIMIT_COV" }
liquidity_index = { min = -0.01, max = 0.04, basis = "Skempton & Henkel 1957, Table 1 (w 26, PL 26, so LI about 0); calibrated (forge analysis) to w mean 26, COV about 0.12 with MOISTURE_COV. Cross-check: BGS NGDC AGS accessions 128985, 129866 (weathered w mean 26.4, COV 0.11, n = 85), forge analysis, contains data supplied by UKRI, OGL v3. Context: ICE Manual of Geotechnical Engineering Vol. 2, ch. 53, Table 53.7, p.784 gives 0 to +0.1" }
particle_density_ratio = { min = 2.60, max = 2.71, basis = "Head, Manual of Soil Laboratory Testing Vol. 1, 3rd ed., Table 3.1, p.126 (kaolinite 2.6, quartz 2.65, calcite 2.71). Mineral values; use as a soil-level range is forge judgement" }
strength = { relation = "cu.linear_with_depth", cu_top_kpa = { min = 45, max = 135, basis = "Brosse, Lo, Davis & Che 2025, doi:10.3850/GRF-25280825_isgsr-185-P110-cd, Table 1, weathered row (n = 35, Su0 mean 90.0 kPa, SD 39.9, COV 0.44); calibrated (forge analysis) to that mean and COV with STRENGTH_COV" }, per_m = { min = 0, max = 0, basis = "forge judgement: no trend with depth in the thin weathered zone" } }
spt = { relation = "spt.stroud_butler", f1 = { min = 4.5, max = 5, basis = "ICE Manual of Geotechnical Engineering Vol. 2, 2012, ch. 63, s63.2.3, p.973, after Simpson and Driscoll 1998" } }

[[units]]
id = "LC"
name = "London Clay"
description = { principals = ["CLAY"], secondaries = ["silt"], colours = ["grey", "bluish grey"] }
sampling = { types = ["U", "D"], interval_m = { min = 1.0, max = 1.5, basis = "ICE Manual of Geotechnical Engineering Vol. 2, 2012, ch. 53, s53.7.2, p.791: sampling typically every 1.5 m" } }

[units.properties]
plastic_limit_percent = { min = 25, max = 27, basis = "Skempton & Henkel 1957, Table 1 (PL about 26 at all depths); Cooling & Skempton, London PL n = 100, mean 26.7, COV 9.4% (ISSMGE-TC304 2021, doi:10.53243/R0001, Appendix); calibrated (forge analysis) to mean 26, COV about 0.09 with LIMIT_COV. Cross-check: BGS NGDC AGS accessions 128985, 129866 (unweathered PL mean 25.7, COV 0.096, n = 125), forge analysis, contains data supplied by UKRI, OGL v3" }
plasticity_index_percent = { min = 36, max = 52, basis = "Jones & Terrington 2011, doi:10.1144/1470-9236/08-112, Table 1, area 3a, central London (modified PI, n = 7,460: mean 44, P10-P90 33-54); calibrated (forge analysis) to that mean and P10-P90 with LIMIT_COV" }
liquidity_index = { min = -0.02, max = 0.01, basis = "Skempton & Henkel 1957, Table 1 (w 26, PL 26, so LI about 0); calibrated (forge analysis) to w mean 26, COV about 0.12 with MOISTURE_COV. Cross-check: BGS NGDC AGS accessions 128985, 129866 (unweathered w mean 25.4, COV 0.12, n = 132), forge analysis, contains data supplied by UKRI, OGL v3. Context: ICE Manual of Geotechnical Engineering Vol. 2, ch. 53, Table 53.7, p.784 gives -0.1 to 0" }
particle_density_ratio = { min = 2.60, max = 2.71, basis = "Head, Manual of Soil Laboratory Testing Vol. 1, 3rd ed., Table 3.1, p.126 (kaolinite 2.6, quartz 2.65, calcite 2.71). Mineral values; use as a soil-level range is forge judgement" }
strength = { relation = "cu.linear_with_depth", cu_top_kpa = { min = 82.5, max = 84.0, basis = "Brosse, Lo, Davis & Che 2025, doi:10.3850/GRF-25280825_isgsr-185-P110-cd, Table 3, Model B per-unit intercepts (82.5-84.0 kPa, z below the top of the London Clay). Measuring z from the top of this unaltered LC unit, below WLC, is forge judgement" }, per_m = { min = 6.4, max = 9.2, basis = "Brosse, Lo, Davis & Che 2025, doi:10.3850/GRF-25280825_isgsr-185-P110-cd, Table 3, Model B per-unit slopes (B 6.4, A3 6.8, C 7.3, A2 9.2 kPa/m); the authors find the fit linear to about 30 m. Scatter about the line calibrated (forge analysis) to their COV of about 0.34 with STRENGTH_COV" } }
spt = { relation = "spt.stroud_butler", f1 = { min = 4.5, max = 5, basis = "ICE Manual of Geotechnical Engineering Vol. 2, 2012, ch. 63, s63.2.3, p.973, after Simpson and Driscoll 1998" } }

# Testing rates. Each SAMP-child rate is sized so the smallest default site
# (3 holes) meets Decoding Eurocode 7's "no comparable experience" minimum
# per stratum in London Clay on every seed, which a test holds. Decoding EC7
# does not define "stratum", and WLC is too thin to reach a minimum on its own
# (under a metre or absent in half the holes; fewer than 3 U samples on 95% of
# 3-hole sites even at rate 1.0), so WLC and LC count together as one London
# Clay stratum: forge judgement. The BGS per-metre rates in the bases
# are a realism check only.

[[suite]]
group = "LNMC"
headings = ["LNMC_MC"]
units = ["WLC", "LC"]
rate = { min = 0.7, max = 1.0, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, water contents at least the Atterberg count (3) per stratum, WLC and LC together (forge judgement); sized so a 3-hole site meets it (forge analysis), and above the LLPL rate so water contents outnumber Atterberg tests on average. Realism check: about 0.33 per m of London Clay against 0.25 in BGS NGDC AGS accessions 128985, 129866, forge analysis, contains data supplied by UKRI, OGL v3" }

[[suite]]
group = "LLPL"
headings = ["LLPL_LL", "LLPL_PL", "LLPL_PI"]
units = ["WLC", "LC"]
rate = { min = 0.3, max = 0.45, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, at least 3 Atterberg tests per stratum, WLC and LC together (forge judgement); sized so a 3-hole site meets it (forge analysis). Realism check: about 0.29 per m of London Clay against 0.24 in BGS NGDC AGS accessions 128985, 129866, forge analysis, contains data supplied by UKRI, OGL v3" }

[[suite]]
group = "LDEN"
headings = ["LDEN_BDEN", "LDEN_DDEN", "LDEN_MC"]
units = ["WLC", "LC"]
rate = { min = 0.5, max = 0.7, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, at least 3 bulk densities per stratum, WLC and LC together (forge judgement); sized so a 3-hole site meets it on U samples alone (forge analysis)" }

[[suite]]
group = "TRIG"
headings = []
units = ["WLC", "LC"]
rate = { min = 0.5, max = 0.7, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, at least 3 triaxial cu tests per stratum, WLC and LC together (forge judgement); sized so a 3-hole site meets it on U samples alone (forge analysis). Realism check: about 0.23 per m of London Clay against 0.23 in BGS NGDC AGS accessions 128985, 129866, forge analysis, contains data supplied by UKRI, OGL v3" }

[[suite]]
group = "TRIT"
headings = ["TRIT_CU", "TRIT_DEVF", "TRIT_CELL", "TRIT_BDEN", "TRIT_IMC"]

[[suite]]
group = "ISPT"
headings = ["ISPT_NVAL"]
