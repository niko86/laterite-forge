# Testing rates. Each SAMP-child rate is sized so the smallest default site
# (3 holes) meets Decoding Eurocode 7's "no comparable experience" minimum
# per stratum in London Clay on every seed, which a test holds. Decoding EC7
# does not define "stratum", and WLC is too thin to reach a minimum on its own
# (under a metre or absent in half the holes; fewer than 3 U samples on 95% of
# 3-hole sites even at rate 1.0), so WLC and LC count together as one London
# Clay stratum: forge judgement. The BGS per-metre rates in the bases
# are a realism check only.

[[suite]]
group = "LNMC"
headings = ["LNMC_MC"]
units = ["WLC", "LC"]
rate = { min = 0.7, max = 1.0, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, water contents at least the Atterberg count (3) per stratum, WLC and LC together (forge judgement); sized so a 3-hole site meets it (forge analysis), and above the LLPL rate so water contents outnumber Atterberg tests on average. Realism check: about 0.33 per m of London Clay against 0.25 in BGS NGDC AGS accessions 128985, 129866, forge analysis, contains data supplied by UKRI, OGL v3" }

[[suite]]
group = "LLPL"
headings = ["LLPL_LL", "LLPL_PL", "LLPL_PI"]
units = ["WLC", "LC"]
rate = { min = 0.3, max = 0.45, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, at least 3 Atterberg tests per stratum, WLC and LC together (forge judgement); sized so a 3-hole site meets it (forge analysis). Realism check: about 0.29 per m of London Clay against 0.24 in BGS NGDC AGS accessions 128985, 129866, forge analysis, contains data supplied by UKRI, OGL v3" }

[[suite]]
group = "LDEN"
headings = ["LDEN_BDEN", "LDEN_DDEN", "LDEN_MC"]
units = ["WLC", "LC"]
rate = { min = 0.5, max = 0.7, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, at least 3 bulk densities per stratum, WLC and LC together (forge judgement); sized so a 3-hole site meets it on U samples alone (forge analysis)" }

[[suite]]
group = "TRIG"
headings = []
units = ["WLC", "LC"]
rate = { min = 0.5, max = 0.7, basis = "Decoding Eurocode 7, Bond and Harris, 2008, ch. 4, s4.5.4, Figs 4.14 and 4.15, p.108, and Example 4.3, p.124: with no comparable experience, at least 3 triaxial cu tests per stratum, WLC and LC together (forge judgement); sized so a 3-hole site meets it on U samples alone (forge analysis). Realism check: about 0.23 per m of London Clay against 0.23 in BGS NGDC AGS accessions 128985, 129866, forge analysis, contains data supplied by UKRI, OGL v3" }

[[suite]]
group = "TRIT"
headings = ["TRIT_CU", "TRIT_DEVF", "TRIT_CELL", "TRIT_BDEN", "TRIT_IMC"]

[[suite]]
group = "ISPT"
headings = ["ISPT_NVAL", "ISPT_MAIN", "ISPT_NPEN", "ISPT_REP"]
units = ["MG", "RTD", "WLC", "LC"]
rate = { min = 1.0, max = 1.0, basis = "Decoding Eurocode 7 (Bond and Harris, 2008) gives no SPT frequency; ICE Manual of Geotechnical Engineering Vol. 1, 2012, p.630: SPTs 'typically every 1.5 m'. An SPT at every D sample follows the sampling interval (forge judgement)" }

