# london-basin: Made Ground over River Terrace Deposits over weathered and
# unweathered London Clay (ADR 0001, #24, #48, #42). Every range carries its
# basis. A basis names the source as found (book, edition, chapter, printed
# page, table) and the original paper where the book names one. "forge judgement" marks a value
# that describes the synthetic site or a modelling choice, not the ground.
# "calibrated (forge analysis)" marks a range tuned so that the values the
# file writes, pooled over many seeds, match the named source's mean and
# spread (docs/research/london-basin-sources.md has the method and results).
#
# Versioning: from v3, any change to what this preset generates bumps
# `version`, and consumers are told and re-baseline (ADR 0001).
#
# Description constraints (not ranges, so they carry no basis field) follow
# these sources:
# - Made Ground: principals CLAY, GRAVEL and SAND (36%, 29% and 29% of 1,288
#   Made Ground soil strata in the BGS Made Ground accessions below, forge
#   analysis); secondaries sand, gravel and clay (commonest forms gravelly
#   sandy CLAY, clayey gravelly SAND, clayey sandy GRAVEL, sandy GRAVEL);
#   colours the six commonest first colour phrases (brown, dark brown, dark
#   grey, light brown, grey, black: 68% of strata). Normal soil terms first,
#   then the man-made constituents (Norbury, Soil and Rock Description in
#   Engineering Practice, 2010, ch. 14, pp.212-214; example p.214: "MADE
#   GROUND: dense brown sandy GRAVEL with occasional tiles, wire, glass,
#   tyres").
# - RTD: light brown, slightly sandy flint GRAVEL (ICE Manual of Geotechnical
#   Engineering Vol. 1, 2012, ch. 13, Fig. 13.1(a), p.142); brown fine to
#   medium sand and gravel (same, ch. 4, Fig. 4.4, p.21).
# - Weathered London Clay: brown silty CLAY (ICE Vol. 1, ch. 13, Fig. 13.1(a),
#   p.142); weathered "brown" against unweathered "blue" (Head, Manual of Soil
#   Laboratory Testing Vol. 2, 2nd ed., Table 14.5, p.372); orange-mottled
#   brown (Head Vol. 1, 3rd ed., Table 7.1, p.371).
# - London Clay: grey silty CLAY (ICE Vol. 1, ch. 13, Fig. 13.1(a), p.142);
#   blue grey fissured silty clay (ICE Vol. 1, ch. 36, Table 36.2, p.496,
#   after Czerewko et al. 2003a; BGS Lexicon, London Clay Formation).
#
# Sources of the v3 and v4 values (each range names the ones it uses):
# - Brosse, Lo, Davis & Che (2025), Revisiting of London Clay simple
#   correlations using a Bayesian approach, Proc. 9th ISGSR, pp. 867-871,
#   doi:10.3850/GRF-25280825_isgsr-185-P110-cd (2,015 Crossrail UU tests).
# - Jones & Terrington (2011), Modelling volume change potential in the London
#   Clay, QJEGH 44(1):109-122, doi:10.1144/1470-9236/08-112.
# - Royse, Rutter & Entwisle (2009), Property attribution of 3D geological
#   models in the Thames Gateway, London, Bull. Eng. Geol. Env. 68(1),
#   doi:10.1007/s10064-008-0171-0.
# - Skempton & Henkel (1957), Tests on London Clay from deep borings at
#   Paddington, Victoria and the South Bank, Proc. 4th ICSMFE, London.
# - ISSMGE-TC304 (2021), State-of-the-art review of inherent variability and
#   uncertainty in geotechnical properties and models, doi:10.53243/R0001
#   (Appendix: Cooling & Skempton, London Clay PL).
# - Bond and Harris (2008), Decoding Eurocode 7, ch. 4, s4.5.4, Figs 4.14 and
#   4.15, p.108, and Example 4.3, p.124 (minimum tests per stratum).
# - BGS National Geotechnical Data Centre AGS accessions, forge analysis of two
#   crawls (docs/research/london-basin-sources.md). Index properties:
#   128985 (Tideway West) and 129866 (West Drayton); terrace-gravel SPT N:
#   128985, 126770, 129866, 121953; water strikes: 163306, 39638, 162465,
#   167350, 167349, 167292, 167290, 83329, 167414, 167131, 168650, 162665,
#   164271, 185262, 192346. Made Ground (v4): the 80 accessions of the two
#   crawls, 663 holes from 126 projects: 39638, 40721, 81109, 81709, 83329,
#   107613, 111549, 121953, 126770, 128985, 129866, 133106, 138366, 138585,
#   138586, 140725, 140726, 141089, 141090, 161518, 161519, 161567, 161905,
#   162207, 162345, 162409, 162410, 162465, 162565, 162665, 162765, 163045,
#   163306, 163405, 164270, 164271, 166866, 167034, 167131, 167132, 167290,
#   167291, 167292, 167344, 167345, 167346, 167347, 167348, 167349, 167350,
#   167413, 167414, 167415, 167951, 167952, 167953, 167954, 168212, 168533,
#   168549, 168650, 168963, 168964, 169038, 169571, 169573, 173376, 185262,
#   185575, 186926, 188520, 188540, 188542, 190850, 190946, 192298, 192311,
#   192312, 192346, 192401. Open Government Licence v3. Contains data supplied
#   by UKRI.
# - Terrington, Silva, Waters, Smith & Thorpe (2018), Geomorphology
#   319:15-34, doi:10.1016/j.geomorph.2018.07.005.
# - Ford, Price, Cooper & Waters (2014), Geol. Soc. London Spec. Publ.
#   395:55-89, doi:10.1144/SP395.12.
#
# v2 context, kept for reference: RTD N 10-30 (Craig's Soil Mechanics 7th
# ed., ch. 8, Table 8.3, p.298, medium dense, after Terzaghi and Peck; logged
# N 15 in terrace gravel, ICE Vol. 1, ch. 13, Fig. 13.1(a), p.142); clay
# plasticity and liquidity from ICE Vol. 2, ch. 53, Table 53.7, p.784 and ICE
# Vol. 1, ch. 36, Table 36.3, p.498, after Cripps and Taylor 1981 and others.
#
# Made Ground (v4, #42) is a mixed unit: CLAY-led strata take their
# consistency term from the fine set (Ic = 1 - LI) and SAND- or GRAVEL-led
# strata their density term from the coarse set's SPT N. Both sets are forge
# judgement, as the BGS exports carry no lab data on Made Ground, calibrated
# (forge analysis) so the leading terms come out in about the BGS
# proportions. A mixed unit takes its moisture content (so its bulk density,
# and the overburden below it) from the fine set; the coarse set's moisture
# content is required by the loader but not read. Every Made Ground SPT,
# CLAY-led or not, writes the coarse set's N. Made Ground takes no lab tests
# (the loader refuses them) and never yields a water strike. Its thickness is
# a skewed range (ADR 0001, "Ground") fitted to the BGS P10, P50, P90 and
# absent share; the field is compressed, so the fit is a compromise, chosen
# to keep the no-strike share inside the BGS 32-46%.
#
# The suite lists no LNMC in RTD: its B and D samples are quality class 4 and
# LNMC needs class 3 (data/sample-quality/table.json), so RTD could carry no
# LNMC row.
#
# v5 (#63): SPT refusals. The ISPT suite lists ISPT_MAIN, ISPT_NPEN and
# ISPT_REP, and any N of 50 or more is written as a refusal, so every N above
# 50 that v4 wrote becomes 50 (p = 300 x 50 / N mm, at least 1 and under 300).
# The refusal convention is forge judgement (owner decision, niko86/laterite-forge#63):
# an ordinary test writes ISPT_MAIN = N, ISPT_NPEN = 450 and ISPT_REP = "N=<N>";
# a refusal writes ISPT_NVAL = 50 (not extrapolated), ISPT_MAIN = 50, ISPT_NPEN =
# 150 + p and ISPT_REP = "50/<p>", p the main-drive penetration reached, mm.
# No unit takes a refusal_share. LC: strength refusals only (owner decision).
# The file gives 22.5% of London Clay tests as refusals against 14.3% in the
# crawl (140 of 977 tests, 34 files), and a non-refusal mean N of 29.9 against
# 29.1. f1 stays at v4's 4.5-5, the range its source supports: at f1 = 5, the
# top of it, the mean is 29.2 but refusals are still 19.3%, so no f1 in the
# range gives both. The gap is the depth mix of the tests, not the rate at
# depth: from 15 m down the crawl refuses 131 of 506 tests (26%) against 29%
# in the file at f1 = 5, but only 52% of the crawl's tests are that deep
# against 63% in the file (docs/research/london-basin-sources.md). RTD: the
# London crawls give 46 refusals in 541 terrace-gravel tests (8.5%; 42 files,
# a bootstrap over files gives 5.2-13.5%), 44 of them with N of 50 or more
# and 2 with a reported N under 50, and the strength rule alone gives 5.5% in
# the file, inside that interval, so the crawl shows no obstruction refusals
# beyond the strength ones. MG: none (forge judgement; fill, and the crawl was
# not read for its refusals). WLC: strength only (0.5%).
#
# v6 (#58): cover layer. A [cover] block gives each hole one draw: hard
# surfacing (25.2% of holes), topsoil (12.8%) or nothing, from the London
# crawls (Made Ground (v4): the 80 accessions of the two crawls listed above,
# 663 holes from 126 projects). The cover takes its thickness off the top of
# the hole's first stratum, so every other boundary, sample, test and strike is
# where v5 put it; only the first GEOL row's top moves and one row is added.
# Surfacing is a Made Ground stratum worded "MADE GROUND: Tarmacadam.",
# "MADE GROUND: Concrete." or "MADE GROUND: Paving slabs."; topsoil is worded
# "<colour> <minor fractions> TOPSOIL with rootlets.". Nothing is sampled or
# tested in the cover, and a sample that would start in it moves to the cover
# base or is dropped (src/site/cover.rs). The description format follows
# Norbury 2010's Made Ground convention (ch. 14, pp.208-214) and is forge
# judgement. The Made Ground unit's own thickness fit is unchanged: the
# crawl's Made Ground thickness includes surfacing, so a hole that draws both
# has its Made Ground (as written) thinner by the surfacing. Topsoil over Made
# Ground (6.8% of holes in the crawl) arises here wherever a topsoil hole has
# Made Ground below it.
#
# v7 (#74): hole construction. A [construction] block gives every hole HDPH
# (an inspection pit from 0 to 1.2 m, then CP to final depth, so LOCA_TYPE is
# IP+CP), CDIA (one casing string, or two when telescoped, never a larger
# diameter below a smaller one), a WSTG_CAS on every strike, and, at the sites
# that carry it, BKFL (arisings, bentonite, or arisings over bentonite, from 0
# to final depth, legend codes 905 and 903 only). A site draws once whether its
# holes carry BKFL (0.5: 8 of the crawl's 16 projects). The final casing passes
# the strike in 92% of holes (the London crawls' rate), and WSTG_CAS never
# exceeds the strike or the final casing. Every other group is what v6 wrote
# (a_preset_without_its_construction_writes_the_previous_versions_bytes); the
# construction groups are written after the suite. The inspection pit depth is
# the owner's practice note (forge judgement); the rest is forge analysis of
# the London crawls' CDIA, WSTG_CAS and BKFL (src/site/construction.rs,
# docs/research/london-basin-sources.md).
# v8 (#75): installations. A [construction.installation] table gives a site a
# draw on whether it installs at all (0.17: 3 of the crawls' 18 projects with
# five or more CP-type holes), then a share of its holes (0.43 to 1.0, the NE
# crawl's range), and each hole draws against it. An installed hole has one
# installation, a 50 mm standpipe (plain, then slotted through the response
# zone) or a 19 mm piezometer (plain, then a 0.3 m tip written as SLOTTED),
# PIPE_REF 1, and its own BKFL in place of the site's: concrete cap, bentonite
# seal, a gravel or sand filter from 0.5 m above the slotted section to 0.5 m
# below it, bentonite to final depth, written even on a site whose holes carry
# no other BKFL. The zone starts at the first strike plus a drawn offset, or at
# a drawn depth when there is no strike, and is placed by depth alone. No MONG:
# it only restates PIPE. A preset without the table writes v7's bytes
# (a_preset_without_its_installation_writes_the_previous_versions_bytes); PIPE
# is written after the other construction groups. Forge analysis of the London
# crawls' PIPE and BKFL, a small sample (src/site/construction.rs,
# docs/research/london-basin-sources.md).
# v9 (#84): water strikes in made ground. The Made Ground unit takes a strike
# block like a till's: a Poisson process along its penetration, with a rise
# range and a share of strikes with no rise. The rate is new in kind,
# rate_by_depth: a rate for each band of depth below ground (0-1, 1-2, 2-3,
# 3-5 and below 5 m), constant within a band, so a strike is likelier deeper in
# the fill. Made-ground water is perched, so an event at or below the hole's
# water table is dropped, and the table rule still never strikes made ground.
# The unit's process runs from the top of the stratum, with the events in a
# cover dropped, so a cover moves none of the strikes below it.
# site.several_strikes = { max_per_hole = 4, min_gap_m = 0.5 } lets a hole
# record the made-ground strike and the table strike below it, each with its own
# WSTD rows and, from the construction rules as built, its own WSTG_CAS. No seal
# block. The rates, the rise and the no-rise share are the London crawl's
# (docs/research/london-basin-sources.md, Made-ground water strikes); the file
# misses the crawl's share of holes with a made-ground strike (7.4% of made-ground
# holes against 16%, the file's made ground being thinner), the strikes' depth
# in the made ground (P50 0.65 of its base against 0.82), the deepest bands'
# rates and the share of multi-strike holes whose first strike is in made ground
# (100% against 47%). A preset without the strike block and the
# several_strikes key writes v8's bytes
# (a_preset_without_its_made_ground_strikes_writes_the_previous_versions_bytes);
# the strike-dependent groups (WSTG, WSTD, WSTG_CAS, the BKFL zone and PIPE)
# move with the strikes. Contains data supplied by UKRI, OGL v3.
schema = 1
name = "london-basin"
version = 9
summary = "Made Ground over River Terrace Deposits over weathered and unweathered London Clay, London Basin."

[site]
extent_m = { x = 300.0, y = 200.0 }
ground_level_m = { min = 5.0, max = 30.0, basis = "forge judgement: a synthetic local datum, not a real elevation" }
groundwater_depth_m = { min = 2.7, max = 7.2, basis = "BGS NGDC AGS water-strike accessions listed above: depth to water 20 minutes after the strike, P10-P90 2.70-7.24 m (n = 25, 11 projects), forge analysis. Contains data supplied by UKRI, OGL v3" }
strike_rise_m = { min = 0.0, max = 2.6, basis = "BGS NGDC AGS water-strike accessions listed above: strike depth minus the 20-minute level, P10-P90 0.02-2.62 m (n = 25, 11 projects), forge analysis. Contains data supplied by UKRI, OGL v3" }
several_strikes = { max_per_hole = 4, min_gap_m = 0.5, basis = "BGS NGDC AGS London crawl (161 unique AGS4 files de-duplicated by content hash, 627 holes with GEOL, 119 projects), forge analysis (docs/research/london-basin-sources.md, Made-ground water strikes): of 300 holes with a strike (73 projects), 224 have one (74.7%), 62 have two (20.7%), 12 have three (4.0%, THIN: 8 projects) and 2 have four, the most in any hole (0.7%, THIN: 2 projects), so max_per_hole = 4; 76 holes (12.1% of the 627 holes with GEOL, 20 projects) have two or more. One of 92 consecutive pairs is 0.5 m apart or closer (consecutive gap P10/P50/P90 1.80/5.30/23.60 m), so min_gap_m = 0.5, the value tyneside-till v9 takes from the NE England crawl. Forge judgement: the strikes come from the model's existing sources (the water table in a coarse stratum, and now the made-ground unit's Poisson process), sorted by depth, with no drawn count. No seal block: WSTG_SEAL is recorded for 10 of 69 made-ground strikes (14%, THIN: 7 projects). Forge calibration, none: the spread is reported, not fitted. The file (3,000 seeds, 14,855 holes) gives 92.0%, 7.4%, 0.6% and 0.04% of struck holes with one, two, three and four strikes against the crawl's 74.7%, 20.7%, 4.0% and 0.7%, 4.3% of holes with two or more against 12.1%, and consecutive gaps P10/P50/P90 1.50/3.82/5.86 m against 1.80/5.30/23.60 m. Known misses, not fitted: the file's only second strike is the made-ground strike, because the terrace deposits are not water-bearing and the clays have no strike block, so every multi-strike hole has its first strike in made ground (100% against the crawl's 47%, 36 of 76), and the crawl's strikes in alluvium, Lambeth and Thanet beds, chalk and rock are not modelled. Strikes per hole were one for every struck hole before v9 (54.1% of holes strike now against 51.5%). Contains data supplied by UKRI, OGL v3." }

[[hole_types]]
code = "CP"
weight = 1
final_depth_m = { min = 20.0, max = 40.0, basis = "forge judgement: an investigation choice; within the 50-60 m percussion boreholes generally reach (Craig's Soil Mechanics, 7th ed., 2004, s10.2, p.376)" }

[[units]]
id = "MG"
name = "Made Ground"
thickness_m = { min = -1.0, max = 5.75, skew = 1.3, basis = "BGS NGDC AGS Made Ground accessions listed above: Made Ground over terrace gravel over London Clay, P10-P90 0.71-4.58 m, P50 1.86 m, about 10% absent (n = 102, 36 projects; Made Ground or fill in the surface sequence of 89.9% of 663 holes); range and skew fitted to these (forge analysis; the file gives P10-P50-P90 about 0.49-1.92-3.90 m, 10% absent; the best unconstrained fit, -0.6 to 6.75 at skew 1.7, lifts the no-strike share above the BGS 46%; docs/research/london-basin-sources.md). Contains data supplied by UKRI, OGL v3. Cross-checks: Terrington et al. 2018, doi:10.1016/j.geomorph.2018.07.005, Table 5 (mean over terrace deposits 2.21-3.19 m); Ford et al. 2014, doi:10.1144/SP395.12, Table 1 (made ground mean 1.4 m, SD 2.6)" }
description = { principals = ["CLAY", "GRAVEL", "SAND"], secondaries = ["sand", "gravel", "clay"], colours = ["brown", "dark brown", "dark grey", "grey", "black", "light brown"] }
strike = { rate_by_depth = [{ from_m = 0.0, rate_per_m = { min = 0.023, max = 0.023, basis = "BGS NGDC AGS London crawl (161 unique AGS4 files de-duplicated by content hash, 627 holes with GEOL, 119 projects), forge analysis (docs/research/london-basin-sources.md, Made-ground water strikes): made-ground (MG) holes in the 73 projects that report WSTG (430 holes, 68 projects), a strike within 0.01 m of the MG base counted as an MG strike; strikes in the 0-1 m band below ground over the made-ground metres in the band: 9 strikes in 399 m = 0.023 per m (THIN: the strikes are in 4 projects). Cross-check, NE England crawl: 0.021 per m (9 strikes in 429 m, THIN: 6 projects). Forge calibration, none: the rate is the crawl's, one rate per band, constant within it, Poisson along the penetration (forge judgement); the file (3,000 seeds, 14,855 holes) gives 0.0246 per m (271 strikes in 11,023 m). Contains data supplied by UKRI, OGL v3." } }, { from_m = 1.0, rate_per_m = { min = 0.033, max = 0.033, basis = "BGS NGDC AGS London crawl (161 unique AGS4 files de-duplicated by content hash, 627 holes with GEOL, 119 projects), forge analysis (docs/research/london-basin-sources.md, Made-ground water strikes): made-ground (MG) holes in the 73 projects that report WSTG (430 holes, 68 projects), a strike within 0.01 m of the MG base counted as an MG strike; strikes in the 1-2 m band below ground over the made-ground metres in the band: 10 strikes in 299 m = 0.033 per m (THIN: the strikes are in 6 projects). Cross-check, NE England crawl: 0.038 per m (14 strikes in 368 m, THIN: 8 projects). Forge calibration, none: the rate is the crawl's, one rate per band, constant within it, Poisson along the penetration (forge judgement); the file (3,000 seeds, 14,855 holes) gives 0.0337 per m (274 strikes in 8,137 m). Contains data supplied by UKRI, OGL v3." } }, { from_m = 2.0, rate_per_m = { min = 0.056, max = 0.056, basis = "BGS NGDC AGS London crawl (161 unique AGS4 files de-duplicated by content hash, 627 holes with GEOL, 119 projects), forge analysis (docs/research/london-basin-sources.md, Made-ground water strikes): made-ground (MG) holes in the 73 projects that report WSTG (430 holes, 68 projects), a strike within 0.01 m of the MG base counted as an MG strike; strikes in the 2-3 m band below ground over the made-ground metres in the band: 12 strikes in 215 m = 0.056 per m (THIN: 12 holes, 9 projects). Cross-check, NE England crawl: 0.048 per m (13 strikes in 270 m, THIN: 6 projects). Forge calibration, none: the rate is the crawl's, one rate per band, constant within it, Poisson along the penetration (forge judgement); the file (3,000 seeds, 14,855 holes) gives 0.0593 per m (277 strikes in 4,675 m). Contains data supplied by UKRI, OGL v3." } }, { from_m = 3.0, rate_per_m = { min = 0.104, max = 0.104, basis = "BGS NGDC AGS London crawl (161 unique AGS4 files de-duplicated by content hash, 627 holes with GEOL, 119 projects), forge analysis (docs/research/london-basin-sources.md, Made-ground water strikes): made-ground (MG) holes in the 73 projects that report WSTG (430 holes, 68 projects), a strike within 0.01 m of the MG base counted as an MG strike; strikes in the 3-5 m band below ground over the made-ground metres in the band: 26 strikes in 249 m = 0.104 per m (26 holes, 12 projects). Cross-check, NE England crawl: 0.076 per m (29 strikes in 382 m, 9 projects). Forge calibration, none: the rate is the crawl's, one rate per band, constant within it, Poisson along the penetration (forge judgement); the file (3,000 seeds, 14,855 holes) gives 0.0942 per m (255 strikes in 2,706 m). Known miss, not fitted: the file gives 0.0942 against 0.104, because it drops a made-ground event at or below the hole's water table (2.7 to 7.2 m down in this preset) while the crawl counts the metres under the water too. Contains data supplied by UKRI, OGL v3." } }, { from_m = 5.0, rate_per_m = { min = 0.103, max = 0.103, basis = "BGS NGDC AGS London crawl (161 unique AGS4 files de-duplicated by content hash, 627 holes with GEOL, 119 projects), forge analysis (docs/research/london-basin-sources.md, Made-ground water strikes): made-ground (MG) holes in the 73 projects that report WSTG (430 holes, 68 projects), a strike within 0.01 m of the MG base counted as an MG strike; strikes in the below 5 m band below ground over the made-ground metres in the band: 21 strikes in 203 m = 0.103 per m (21 holes, 8 projects). Cross-check, NE England crawl: 0.080 per m (48 strikes in 599 m, 10 projects). Forge calibration, none: the rate is the crawl's, one rate per band, constant within it, Poisson along the penetration (forge judgement); the file (3,000 seeds, 14,855 holes) gives 0.0334 per m (3 strikes in 90 m). Known miss, not fitted: the file gives 0.0334 against 0.103 on only 90 m of made ground (the file's made ground is P10/P50/P90 0.41/1.87/3.87 m thick against the crawl's 0.62/2.20/6.00 m, so 14,855 holes cross 90 m of it below 5 m against the crawl's 203 m in 430 holes), and an event under the water table is dropped (a perched strike is above the table by construction). Contains data supplied by UKRI, OGL v3." } }], rise_m = { min = 0.2, max = 2.5, skew = 2.4, basis = "BGS NGDC AGS London crawl (161 unique AGS4 files de-duplicated by content hash, 627 holes with GEOL, 119 projects), forge analysis (docs/research/london-basin-sources.md, Made-ground water strikes): made-ground (MG) holes in the 73 projects that report WSTG (430 holes, 68 projects), a strike within 0.01 m of the MG base counted as an MG strike; rise of the MG strikes with readings, strike depth less the level 20 minutes after (else the last reading; WSTG has no rise column): 35 strikes (35 holes, 13 projects), 23 of them rise by more than 0.05 m (23 holes, 8 projects), and those rise P10/P25/P50/P75/P90 0.20/0.30/0.50/0.88/1.38 m, max 2.50 m; none fell. Cross-check, NE England crawl: 53 rising strikes of 58 with readings (13 projects), P10/P25/P50/P75/P90 0.10/0.10/0.30/0.60/1.16 m (max 6.80 m, 1 fell). Forge calibration: the range is the crawl's P10 and max (min 0.2, max 2.5 m) and the skew is fitted to the crawl's P50 of the rising strikes; the file's rising strikes (708 of 1,080 made-ground strikes, 3,000 seeds, 14,855 holes) give P10/P25/P50/P75/P90 0.20/0.25/0.49/1.00/1.58 m, max 2.45 m. Known misses, not fitted: P75 1.00 against 0.88 m and P90 1.58 against 1.38 m (one skew cannot match the centre and the tail of a distribution this flat in the middle), and P25 0.25 against 0.30 m; the rise is also capped at ground level, which no crawl strike reached (none rose to ground). Forge judgement: the water always rises by a draw in this range (bar the no-rise share) but not above ground level, and the made-ground water is perched, so the site water table bounds nothing. Contains data supplied by UKRI, OGL v3." }, no_rise_share = { min = 0.34, max = 0.34, basis = "BGS NGDC AGS London crawl (161 unique AGS4 files de-duplicated by content hash, 627 holes with GEOL, 119 projects), forge analysis (docs/research/london-basin-sources.md, Made-ground water strikes): made-ground (MG) holes in the 73 projects that report WSTG (430 holes, 68 projects), a strike within 0.01 m of the MG base counted as an MG strike; MG strikes whose level is within 0.05 m of the strike at 20 minutes or at the last reading: 12 of 35 strikes with readings (34%; 12 holes, 10 projects, THIN: 12 holes), none fell. Cross-check, NE England crawl: 5 of 58 (9%, 13 projects), 1 fell. Forge calibration: the share of strikes drawn with no rise is the crawl's; the file (3,000 seeds, 14,855 holes) gives 34.4% of its 1,080 made-ground strikes with a rise of 0.05 m or less. Contains data supplied by UKRI, OGL v3." } }
sampling = { types = ["B", "D"], interval_m = { min = 1.0, max = 1.5, basis = "ICE Manual of Geotechnical Engineering Vol. 2, 2012, ch. 53, s53.7.2, p.791: sampling typically every 1.5 m; Craig's Soil Mechanics, 7th ed., 2004, ch. 8, p.297: SPT every 0.75-1.5 m" } }

